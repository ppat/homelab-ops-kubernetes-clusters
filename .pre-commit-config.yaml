---
default_language_version:
  node: 26.13.0
  python: 3.15.2
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  # The five Python files here are CronJob payloads embedded via configMapGenerator, so a syntax
  # error is *valid YAML inside a valid ConfigMap* and `validate-k8s` cannot see it. It would
  # deploy, crash on every run, and -- with no alerting in this estate -- go unnoticed until
  # someone missed the data. For ci-diagnostics that data is unrecoverable: it ingests GitHub
  # Actions logs, which expire at 90 days.
  - id: check-ast
  - id: check-executables-have-shebangs
  - id: check-json
    # openclaw.json is JS-style JSON5 (comments) fed straight into a ConfigMap
    # via configMapGenerator, not parsed by us -- OpenClaw's own JSON5 parser reads
    # it -- so strict-JSON validation doesn't apply here (mirrors the .yamllint
    # ignore homelab-ops-kubernetes-apps uses for the module's own copy).
    exclude: ^clusters/homelab/services/ai/openclaw/openclaw\.json$
  - id: check-shebang-scripts-are-executable
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: forbid-new-submodules
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace
- repo: https://github.com/sirosen/texthooks
  rev: 0.7.1
  hooks:
  - id: fix-smartquotes
  - id: fix-ligatures
  - id: fix-spaces
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    args: [--strict]
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.24.0
  hooks:
  - id: markdownlint-cli2
    args: ["--fix", "--config", ".markdownlint-cli2.yaml"]
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
- repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
  rev: v9.27.0
  hooks:
  - id: commitlint
    language: node
    stages: [commit-msg]
    additional_dependencies:
    - '@commitlint/cli@21.2.4'
    - '@commitlint/config-conventional@21.2.4'
    - '@commitlint/ensure@21.2.4'
    - 'commitlint-plugin-function-rules@5.0.1'
    args: ['--verbose']
- repo: https://github.com/ppat/validate-kubernetes-manifests
  rev: v0.1.13
  hooks:
  - id: validate-k8s
    args:
    - --pkg-include
    - '["clusters/*"]'
    - --pkg-exclude
    - '["components/*"]'
    - --kubeconform-flags
    - '-skip=Secret,IPAddressPool'
    - --env-file
    - ci/validation/.env
    - --base-kustomization-file
    - ci/validation/kustomization.yaml
    - --debug
