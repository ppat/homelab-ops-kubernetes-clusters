---
# yamllint disable rule:line-length
# Static analysis that needs no live cluster — distinct from lint.yaml (which only checks
# style/formatting via yamllint/markdownlint/commitlint/etc). Most jobs here check security
# invariants; retention-pairing (below) is a config-consistency check of the same shape
# (no cluster required, fails loud on a specific known-bad state) but not itself a
# security check — grouped here rather than in a one-job workflow of its own.
#
# rbac-clusterroles statically validates the read-only RBAC ClusterRoles and
# their ClusterRoleBindings in clusters/*/cluster/rbac/ against the two
# policies in ci/policy-tests/ (rbac-clusterrole-readonly.yaml and
# rbac-clusterrolebinding-roleref.yaml) using the Kyverno CLI (`kyverno
# apply`, no cluster required). Those policies are test-only: they live
# under ci/ and are never wired up to a Flux Kustomization or applied to a
# cluster.
#
# There used to be a volume-types job here too, Kyverno-CLI-testing
# restrict-volume-types.yaml (then under policies/pod-security-standard/restricted/)
# against fixtures in ci/policy-tests/fixtures/restrict-volume-types/. That
# policy now lives in the standalone homelab-ops-policies repo (see
# DESIGN.md#policy-enforcement), which carries the same fixtures and owns
# this exact check in its own CI -- this repo no longer has a copy of the
# policy to test against, so duplicating the check here would just drift.
name: static-analysis

on:
  pull_request:
    paths:
    - '.github/workflows/static-analysis.yaml'
    # Scoped to exactly what this analyses and what does the analysing -- the RBAC
    # manifests under test and the policy asserting their invariants. Broader globs would
    # run it on every clusters/ or ci/ edit for no signal.
    - 'clusters/*/cluster/rbac/**'
    - 'ci/policy-tests/**'
    # retention-pairing job below: the two files whose global-retention literals must agree,
    # the script that checks it, and this workflow file itself.
    - 'clusters/homelab/kustomizations/config-services.yaml'
    - 'clusters/homelab/kustomizations/infra-observability-core.yaml'
    - 'ci/scripts/check-loki-retention-pairing.sh'
  schedule:
  - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rbac-clusterroles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Pinned to the Kyverno CLI release matching the appVersion of the
      # kyverno chart deployed by infra-security-core (see the apps repo's
      # infrastructure/subsystems/security-core/kyverno/helm-release-kyverno.yaml),
      # so the CLI's policy engine matches what's actually running.
      # renovate: datasource=github-releases depName=kyverno/kyverno
      KYVERNO_CLI_VERSION: "v1.19.0"
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@9c16506c3c527478b6314c86ca961c0011d9f94a # v2.2.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          kyverno = "${{ env.KYVERNO_CLI_VERSION }}"

    - name: Validate RBAC ClusterRoles are read-only (Kyverno CLI, no cluster required)
      working-directory: ./current
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -uo pipefail
        # One `kyverno apply` invocation per cluster directory: every cluster
        # defines a ClusterRole named mcp-kubernetes-readonly, and since
        # ClusterRoles are cluster-scoped (no namespace to disambiguate them),
        # loading two clusters' rbac/ directories into a single invocation
        # makes the CLI's resource cache collide same-named resources from
        # different clusters together, silently dropping one.
        status=0
        for dir in clusters/*/cluster/rbac; do
          echo "::group::${dir}"
          echo "Resource files loaded from ${dir}:"
          find "${dir}" -maxdepth 1 -type f -name '*.yaml' | sort
          echo
          # --table + --detailed-results renders one row per (rule, resource)
          # pair with its pass/fail outcome and message, so the log itself
          # shows every rule that ran against every matched resource, not
          # just a pass/fail summary count. --remove-color strips ANSI codes
          # that would otherwise print as raw escape sequences in the
          # non-interactive Actions log.
          if ! mise exec -- kyverno apply ci/policy-tests/rbac-clusterrole-readonly.yaml ci/policy-tests/rbac-clusterrolebinding-roleref.yaml --resource "${dir}/" --table --detailed-results --remove-color; then
            status=1
          fi
          echo "::endgroup::"
        done
        exit "${status}"

  retention-pairing:
    # loki-query-correctness (clusters/homelab/services/loki-query-correctness) computes
    # its retention guard from GLOBAL_RETENTION, sourced from config-services.yaml's
    # global_loki_retention postBuild variable — a manually-maintained duplicate of
    # infra-observability-core.yaml's loki_retention_size, the value that actually governs
    # Loki's compactor, because Flux cannot reference one Kustomization's postBuild
    # variable from another. Without this check the pair can only drift silently, in the
    # unsafe direction (a stale, too-long GLOBAL_RETENTION lets the guard trust a window
    # past when the data is actually gone). See ci/scripts/check-loki-retention-pairing.sh
    # for the full rationale and loki-query-correctness.py's GLOBAL_RETENTION comment.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Assert homelab's global_loki_retention matches loki_retention_size
      shell: bash
      run: ./ci/scripts/check-loki-retention-pairing.sh
