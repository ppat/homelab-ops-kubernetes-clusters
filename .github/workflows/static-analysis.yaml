---
# yamllint disable rule:line-length
# Static analysis of security invariants — distinct from lint.yaml (which
# only checks style/formatting via yamllint/markdownlint/commitlint/etc).
# rbac-clusterroles statically validates the read-only RBAC ClusterRoles and
# their ClusterRoleBindings in clusters/*/cluster/rbac/ against the two
# policies in ci/policy-tests/ (rbac-clusterrole-readonly.yaml and
# rbac-clusterrolebinding-roleref.yaml) using the Kyverno CLI (`kyverno
# apply`, no cluster required). Those policies are test-only: they live
# under ci/ and, unlike policies/**, are never wired up to a Flux
# Kustomization or applied to a cluster.
name: static-analysis

on:
  pull_request:
    paths:
    - '.github/workflows/static-analysis.yaml'
    # Scoped to exactly what this analyses and what does the analysing -- the RBAC
    # manifests under test and the policy asserting their invariants. Broader globs would
    # run it on every clusters/ or ci/ edit for no signal.
    - 'clusters/*/cluster/rbac/**'
    - 'ci/policy-tests/**'
    # The policy whose allow-list and exclusion scoping the volume-types job below pins. Same
    # reasoning as above: scoped to the one policy file under test, not policies/** at large.
    - 'policies/pod-security-standard/restricted/restrict-volume-types.yaml'
  schedule:
  - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rbac-clusterroles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Pinned to the Kyverno CLI release matching the appVersion of the
      # kyverno chart deployed by infra-security-core (see the apps repo's
      # infrastructure/subsystems/security-core/kyverno/helm-release-kyverno.yaml),
      # so the CLI's policy engine matches what's actually running.
      # renovate: datasource=github-releases depName=kyverno/kyverno
      KYVERNO_CLI_VERSION: "v1.18.2"
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@f1ae73db4ab080b7e8dc66d078e5905d5ca526cb # v2.1.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          kyverno = "${{ env.KYVERNO_CLI_VERSION }}"

    - name: Validate RBAC ClusterRoles are read-only (Kyverno CLI, no cluster required)
      working-directory: ./current
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -uo pipefail
        # One `kyverno apply` invocation per cluster directory: every cluster
        # defines a ClusterRole named mcp-kubernetes-readonly, and since
        # ClusterRoles are cluster-scoped (no namespace to disambiguate them),
        # loading two clusters' rbac/ directories into a single invocation
        # makes the CLI's resource cache collide same-named resources from
        # different clusters together, silently dropping one.
        status=0
        for dir in clusters/*/cluster/rbac; do
          echo "::group::${dir}"
          echo "Resource files loaded from ${dir}:"
          find "${dir}" -maxdepth 1 -type f -name '*.yaml' | sort
          echo
          # --table + --detailed-results renders one row per (rule, resource)
          # pair with its pass/fail outcome and message, so the log itself
          # shows every rule that ran against every matched resource, not
          # just a pass/fail summary count. --remove-color strips ANSI codes
          # that would otherwise print as raw escape sequences in the
          # non-interactive Actions log.
          if ! mise exec -- kyverno apply ci/policy-tests/rbac-clusterrole-readonly.yaml ci/policy-tests/rbac-clusterrolebinding-roleref.yaml --resource "${dir}/" --table --detailed-results --remove-color; then
            status=1
          fi
          echo "::endgroup::"
        done
        exit "${status}"

  volume-types:
    # Pins what restrict-volume-types actually decides, in both directions. An allow-list is
    # only as good as what it still refuses, and what it refuses is only checked if something
    # goes red when it widens -- a fixture that passes tells you nothing on its own, because it
    # would also pass against a policy that had been deleted outright.
    #
    # So every fixture declares its expected outcome in its filename (-allowed / -denied) and
    # its header, and the suite is deliberately built so no fixture is vacuous:
    #
    #   * `image` is permitted for ordinary pods, asserted in two unrelated namespaces under two
    #     unrelated names, because the claim is that it is allowed GLOBALLY. One fixture cannot
    #     tell that apart from the name-and-namespace-scoped exclusion this policy used to carry.
    #   * hostPath is STILL denied for ordinary pods -- without this the suite cannot distinguish
    #     "we allowed `image`" from "we broke the policy", which is the whole reason the policy
    #     exists.
    #   * hostPath alongside a permitted `image` volume is still denied, catching an allow-list
    #     mis-edit that would read "if any key is allowed, pass".
    #   * the pre-existing virt-handler / virt-launcher exclusions still hold, and are still
    #     scoped by name AND namespace, asserted on hostPath rather than on `image` -- now that
    #     `image` is globally allowed, an `image`-based fixture for those pods would pass whether
    #     the exclusions existed or not. See pod-virt-launcher-hostpath-allowed.yaml.
    #
    # Runs the real policy file from policies/, not a copy under ci/ -- unlike the
    # rbac-clusterroles job above, whose policies are test-only assertions about manifests.
    # Here the policy *is* the thing under test, so a copy would be the bug.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Kept in lockstep with the rbac-clusterroles job above, for the same reason: the CLI's
      # policy engine should match the kyverno actually deployed by infra-security-core.
      # renovate: datasource=github-releases depName=kyverno/kyverno
      KYVERNO_CLI_VERSION: "v1.18.2"
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@f1ae73db4ab080b7e8dc66d078e5905d5ca526cb # v2.1.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          kyverno = "${{ env.KYVERNO_CLI_VERSION }}"

    - name: Assert restrict-volume-types allows image volumes and still denies hostPath
      working-directory: ./current
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -uo pipefail
        policy=policies/pod-security-standard/restricted/restrict-volume-types.yaml
        fixtures=ci/policy-tests/fixtures/restrict-volume-types
        # `kyverno apply` exits 0 when nothing failed and 1 when a rule failed, and it does so
        # for validationFailureAction: Audit too -- verified, because "Audit means the CLI
        # can't fail" would silently turn every row below green. Note that exit 0 conflates two
        # different things: a pod that PASSES the rule (its volume types are all allow-listed)
        # and a pod that is EXCLUDED so the rule never evaluates. The -denied fixtures are what
        # distinguish those from "the policy no longer objects to anything".
        status=0
        for fixture in "${fixtures}"/*.yaml; do
          case "$(basename "${fixture}")" in
            *-allowed.yaml) want=0 ;;
            *-denied.yaml) want=1 ;;
            *) echo "::error::${fixture} declares no expected outcome in its filename"; status=1; continue ;;
          esac
          echo "::group::${fixture} (want exit ${want})"
          # `|| got=$?` is load-bearing, not a style tic -- do NOT "clean up" into a bare call
          # followed by `got=$?`. Actions invokes this step as `bash --noprofile --norc -e -o
          # pipefail`, and the `set -uo pipefail` above does not cancel that inherited `-e`.
          # A bare invocation therefore aborts the whole script on the first fixture that
          # exits non-zero -- which is precisely the -denied fixtures, whose *job* is to exit
          # non-zero. Measured: it killed the run mid-loop, so later fixtures never ran and
          # no `::error file=` was ever printed, and the job failed while the policy under
          # test was behaving perfectly. A guard rail that cannot run to completion, failing in
          # a way that looks exactly like the thing it guards being broken.
          # `|| got=$?` keeps `-e` on for every other command here while making this one
          # command's non-zero exit the data it is supposed to be. (The sibling
          # rbac-clusterroles job above dodges this by wrapping its call in `if ! ...; then`,
          # which is `-e`-exempt for the same reason; this job needs the numeric code, not
          # just pass/fail.)
          got=0
          mise exec -- kyverno apply "${policy}" --resource "${fixture}" --table --detailed-results --remove-color || got=$?
          echo "::endgroup::"
          if [ "${got}" -ne "${want}" ]; then
            echo "::error file=${fixture}::expected kyverno apply to exit ${want}, got ${got} -- restrict-volume-types no longer decides this pod the way its allow-list and exclusions say it should"
            status=1
          fi
        done
        exit "${status}"
