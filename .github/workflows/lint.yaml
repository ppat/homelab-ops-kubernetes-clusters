---
# yamllint disable rule:line-length
name: lint

on:
  pull_request:
  schedule:
  - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      # yamllint disable-line rule:indentation
      files_yaml: |
        actions:
        - .github/workflows/**.yaml
        alloy:
        - '**/*.alloy'
        - 'clusters/*/kustomizations/*.yaml'
        - ci/scripts/alloy-lint.sh
        - ci/scripts/alloy-lint-version.yaml
        - ci/alloy/module-anchors.alloy.stub
        - .github/workflows/lint.yaml
        kubernetes:
        - 'clusters/**/*.yaml'
        - 'ci/**/*.yaml'
        - 'policies/**/*.yaml'
        markdown:
        - '**.md'
        - '!**/CHANGELOG.md'
        renovate:
        - .github/renovate.json
        - .github/renovate/**
        shellscripts:
        - '**.sh'
        yaml:
        - '**.yaml'
      git_ref: ${{ github.head_ref || github.ref }}

  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ppat/github-workflows/.github/workflows/lint-commit-messages.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref }}
      fetch_depth: ${{ github.event.pull_request.commits || 0 }}
      from: ${{ github.event.pull_request.head.sha || 'HEAD' }}~${{ github.event.pull_request.commits || '1' }}
      to: ${{ github.event.pull_request.head.sha || 'HEAD' }}

  alloy:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).alloy_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    # Whether this job runs at all is gated by detect-changes (above), scoped to every
    # *.alloy fragment, every clusters/*/kustomizations/*.yaml -- the same path pattern
    # ci/scripts/alloy-lint.sh itself scans for the embedded-copy side of check-embedded,
    # so the trigger glob and the script's own discovery can't drift apart -- and this
    # gate's own inputs (the script, its version pin, the module-anchor stub, this
    # workflow file). What it checks once running is a separate concern: each step below
    # still discovers every *.alloy file and every kustomization in the repo, not just
    # the changed ones -- alloy validate operates on a directory as one merged unit and
    # check-embedded scans all kustomizations regardless (see ci/scripts/alloy-lint.sh),
    # so a partial file list would produce false negatives or positives either way.
    - name: alloy fmt --test
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        mapfile -t files < <(git ls-files -- '*.alloy')
        ./ci/scripts/alloy-lint.sh fmt-check "${files[@]}"

    - name: alloy validate
      if: success() || failure()
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        mapfile -t files < <(git ls-files -- '*.alloy')
        ./ci/scripts/alloy-lint.sh validate "${files[@]}"

    - name: alloy embedded fragment sync
      if: success() || failure()
      shell: bash
      run: ./ci/scripts/alloy-lint.sh check-embedded

  github-actions:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-github-actions.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).actions_all_changed_files }}

  kubernetes-manifests:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).kubernetes_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Format file list for validation
      id: format-files
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        changed_files="${{ github.event_name == 'pull_request' && fromJSON(needs.detect-changes.outputs.results).kubernetes_all_changed_files || '' }}"
        if [[ -n "$changed_files" ]]; then
          # Convert space-delimited string to a JSON array string
          echo "$changed_files" | tr ' ' '\n' | jq -R . | jq -s -c . > /tmp/files.json
          echo "files_json=$(cat /tmp/files.json)" >> $GITHUB_OUTPUT
        else
          echo "files_json=[]" >> $GITHUB_OUTPUT
        fi

    - name: Validate Kubernetes Manifests
      uses: ppat/validate-kubernetes-manifests@8d0eab3c27c0170576d933dc3da164f9fc56fd72 # v0.1.12
      with:
        files: ${{ steps.format-files.outputs.files_json }}
        pkg-include: '["clusters/*","policies/*"]'
        pkg-exclude: '["components/*",".archive/*"]'
        kubeconform-flags: '-skip=Secret,IPAddressPool'
        env-file: 'ci/validation/.env'
        base-kustomization-file: 'ci/validation/kustomization.yaml'
        debug: true

  markdown:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-markdown.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).markdown_all_changed_files }}

  pre-commit:
    uses: ppat/github-workflows/.github/workflows/lint-pre-commit.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}

  renovate-config-check:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).renovate_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-renovate-config-check.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).renovate_all_changed_files }}

  shellcheck:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).shellscripts_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-shellcheck.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).shellscripts_all_changed_files }}

  yaml:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).yaml_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-yaml.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).yaml_all_changed_files }}

  zizmor:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-zizmor.yaml@53fe31687a5d45d36fb9089090851c82f0294095 # v5.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
