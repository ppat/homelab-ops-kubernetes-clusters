---
# yamllint disable rule:line-length
name: lint

on:
  pull_request:
  schedule:
  - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      # yamllint disable-line rule:indentation
      files_yaml: |
        actions:
        - .github/workflows/**.yaml
        kubernetes:
        - 'clusters/**/*.yaml'
        - 'ci/**/*.yaml'
        - 'policies/**/*.yaml'
        markdown:
        - '**.md'
        - '!**/CHANGELOG.md'
        renovate:
        - .github/renovate.json
        - .github/renovate/**
        shellscripts:
        - '**.sh'
        yaml:
        - '**.yaml'
      git_ref: ${{ github.head_ref || github.ref }}

  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ppat/github-workflows/.github/workflows/lint-commit-messages.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref }}
      fetch_depth: ${{ github.event.pull_request.commits || 0 }}
      from: ${{ github.event.pull_request.head.sha || 'HEAD' }}~${{ github.event.pull_request.commits || '1' }}
      to: ${{ github.event.pull_request.head.sha || 'HEAD' }}

  github-actions:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-github-actions.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).actions_all_changed_files }}

  kubernetes-manifests:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).kubernetes_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Format file list for validation
      id: format-files
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        changed_files="${{ github.event_name == 'pull_request' && fromJSON(needs.detect-changes.outputs.results).kubernetes_all_changed_files || '' }}"
        if [[ -n "$changed_files" ]]; then
          # Convert space-delimited string to a JSON array string
          echo "$changed_files" | tr ' ' '\n' | jq -R . | jq -s -c . > /tmp/files.json
          echo "files_json=$(cat /tmp/files.json)" >> $GITHUB_OUTPUT
        else
          echo "files_json=[]" >> $GITHUB_OUTPUT
        fi

    - name: Validate Kubernetes Manifests
      uses: ppat/validate-kubernetes-manifests@a1ab8c1b32093d6b40bfbe23fd211a5f02d57572 # v0.1.10
      with:
        files: ${{ steps.format-files.outputs.files_json }}
        pkg-include: '["clusters/*","policies/*"]'
        pkg-exclude: '["components/*",".archive/*"]'
        kubeconform-flags: '-skip=Secret,IPAddressPool'
        env-file: 'ci/validation/.env'
        base-kustomization-file: 'ci/validation/kustomization.yaml'
        debug: true

  markdown:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-markdown.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).markdown_all_changed_files }}

  pre-commit:
    uses: ppat/github-workflows/.github/workflows/lint-pre-commit.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}

  rbac-clusterrole-readonly:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).kubernetes_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Pinned to the Kyverno CLI release matching the appVersion of the
      # kyverno chart deployed by infra-security-core (see the apps repo's
      # infrastructure/subsystems/security-core/kyverno/helm-release-kyverno.yaml),
      # so the CLI's policy engine matches what's actually running.
      KYVERNO_CLI_VERSION: v1.18.2
      KYVERNO_CLI_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Install Kyverno CLI
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -euo pipefail
        curl -sL -o /tmp/kyverno-cli.tar.gz \
          "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
        echo "${KYVERNO_CLI_SHA256}  /tmp/kyverno-cli.tar.gz" | sha256sum -c -
        mkdir -p "${RUNNER_TEMP}/kyverno-cli"
        tar -xzf /tmp/kyverno-cli.tar.gz -C "${RUNNER_TEMP}/kyverno-cli" kyverno
        echo "${RUNNER_TEMP}/kyverno-cli" >> "$GITHUB_PATH"

    - name: Validate RBAC ClusterRoles are read-only (Kyverno CLI, no cluster required)
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -uo pipefail
        # One `kyverno apply` invocation per cluster directory: every cluster
        # defines a ClusterRole named mcp-kubernetes-readonly, and since
        # ClusterRoles are cluster-scoped (no namespace to disambiguate them),
        # loading two clusters' rbac/ directories into a single invocation
        # makes the CLI's resource cache collide same-named resources from
        # different clusters together, silently dropping one.
        status=0
        for dir in clusters/*/cluster/rbac; do
          echo "::group::${dir}"
          if ! kyverno apply ci/policy-tests/rbac-clusterrole-readonly.yaml --resource "${dir}/" --detailed-results; then
            status=1
          fi
          echo "::endgroup::"
        done
        exit "${status}"

  renovate-config-check:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).renovate_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-renovate-config-check.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).renovate_all_changed_files }}

  shellcheck:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).shellscripts_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-shellcheck.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).shellscripts_all_changed_files }}

  yaml:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).yaml_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-yaml.yaml@10103e49c72fbd6d3e06d7e29f51815b9b8644a6 # v4.2.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).yaml_all_changed_files }}
