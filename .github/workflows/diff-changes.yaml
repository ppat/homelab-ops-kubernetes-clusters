---
# yamllint disable rule:line-length
name: diff-changes

on:
  pull_request:
    branches: ["main"]
    paths:
    - '.github/workflows/diff-changes.yaml'
    - 'clusters/**/*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@bd0f4ff0d64b30c217a45bf3fbdc530c06bb5586 # v9.0.0
    with:
      # yamllint disable-line rule:indentation
      files: |
        .github/workflows/diff-changes.yaml
        clusters/**/*.yaml
      dir_names: true
      dir_names_max_depth: 2
      dir_names_exclude_current_dir: true
      matrix: true
      git_ref: ${{ github.head_ref || github.ref }}

  affected-clusters:
    needs: [detect-changes]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      affected_clusters: ${{ steps.extract-clusters.outputs.clusters }}
    steps:
    - name: Extract cluster names
      id: extract-clusters
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        if [[ '${{ fromJSON(needs.detect-changes.outputs.results).all_changed_files }}' == '[".github/workflows"]' ]]; then
          echo "Workflow changed - testing all clusters..."
          echo 'clusters=["homelab","nas"]' >> "$GITHUB_OUTPUT"
        else
          echo "Testing changed clusters..."
          # Extract cluster names from directory paths like "clusters/homelab" -> "homelab"
          mapfile -t clusters < <(echo '${{ fromJSON(needs.detect-changes.outputs.results).all_changed_files }}' | jq -r 'map(select(startswith("clusters/")) | split("/")[1]) | unique | .[]')
          # Convert arrays to JSON using printf and jq
          printf '%s\n' "${clusters[@]}" | jq -R . | jq -s -c . > /tmp/clusters.json
          if [[ "$(cat /tmp/clusters.json)" != '[""]' ]]; then
            echo "clusters=$(cat /tmp/clusters.json)" >> "$GITHUB_OUTPUT"
          else
            echo "clusters=[]" >> "$GITHUB_OUTPUT"
          fi
        fi

  diff:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [affected-clusters]
    if: ${{ needs.affected-clusters.outputs.affected_clusters != '[]' }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJSON(needs.affected-clusters.outputs.affected_clusters) }}

    steps:
    - name: Flux Diff
      id: flux-diff
      uses: ppat/homelab-ops-actions/actions/flux-diff@b243512e70e84044d607787b1f482881906b0f01 # v3.0.0
      with:
        log_level: DEBUG
        # One run renders the whole graph, so `all` reports Kustomization and Helm output
        # together, and Helm flags apply to both.
        other_params: --api-versions monitoring.coreos.com/v1
        path_after: clusters/${{ matrix.cluster }}
        path_before: clusters/${{ matrix.cluster }}
        resource_type: all
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment on PR w/ diff
      uses: ppat/homelab-ops-actions/actions/comment-on-pr@66ed3b99f806f50f4e623d3d346f4ba37505ec68 # v2.12.0
      if: ${{ steps.flux-diff.outputs.diff != '' }}
      continue-on-error: true
      with:
        message: |
          `````diff
          ${{ steps.flux-diff.outputs.diff }}
          `````
        message_id: "${{ github.event.pull_request.number }}/${{ matrix.cluster }}"
        token: ${{ secrets.GITHUB_TOKEN }}
