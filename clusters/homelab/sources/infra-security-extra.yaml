---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infra-security-extra
  namespace: flux-system
spec:
  # Maps this cluster's own Kustomize components into the module artifact's components/ path
  # (see components/db-longhorn-trim-daily/kustomization.yaml).
  include:
  - repository:
      name: root
    fromPath: clusters/homelab/components/db-longhorn-trim-daily
    toPath: components/db-longhorn-trim-daily
  ignore: |
    # exclude all
    /*
    # include components
    !/components
    # include the corresponding infrastructure subsystems directory
    !/infrastructure/subsystems/security-extra
  interval: 1m0s
  ref:
    tag: infra-security-extra-v0.3.0
  url: https://github.com/ppat/homelab-ops-kubernetes-apps.git
