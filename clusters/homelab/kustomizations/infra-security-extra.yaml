---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-security-extra
  namespace: flux-system
spec:
  components:
  - ../../../components/db-backups
  - ../../../components/db-restore
  dependsOn:
  - name: infra-security-core
    namespace: flux-system
  - name: infra-storage-core
    namespace: flux-system
  - name: infra-database-core
    namespace: flux-system
  interval: 15m0s
  path: ./infrastructure/subsystems/security-extra
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-security-extra
    namespace: flux-system
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      authentik_media_s3_host: garage-s3
      authentik_media_s3_custom_domain_host: homelab-authentik-media.garage-web
      authentik_media_s3_region: us-east-1
      authentik_media_s3_accesskey_key: garage_key_authentik_accesskey
      authentik_media_s3_secretkey_key: garage_key_authentik_secretkey
      cert_issuer: letsencrypt-production-issuer
      backup_s3_host: s3.nas
      backup_s3_region: us-east-1
      db_name: authentik-db
      db_suffix_current: "v20251017"
      db_suffix_restore: "2025.10.06"
      db_namespace: authentik
      db_bootstrap_database: authentik
      db_bootstrap_owner: authentik
      db_replicas: "3"
      db_storage_class: sc-longhorn-local-non-replicated
      db_storage_size: 20Gi
      redis_replicas: "3"
      secret_store: bitwarden-secret-manager-store
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
  patches:
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/affinity
        value:
          podAntiAffinityType: required
    target:
      group: postgresql.cnpg.io
      kind: Cluster
  # CloudNativePG copies inheritedMetadata labels onto every PVC it owns, existing ones included,
  # which puts PGDATA volumes in Longhorn's daily trim group. No snapshot-ops or backup-ops:
  # databases are backed up by CloudNativePG itself.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: irrelevant
      spec:
        inheritedMetadata:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/trim-daily: enabled
    target:
      group: postgresql.cnpg.io
      kind: Cluster
