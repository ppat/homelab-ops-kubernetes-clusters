---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-ai
  namespace: flux-system
spec:
  components:
  - ../../../components/oidc-credentials/openwebui
  - ../../../components/sso
  - ../../../components/db-backups
  - ../../../components/db-restore
  dependsOn:
  - name: infra-security-extra
    namespace: flux-system
  - name: infra-storage-core
    namespace: flux-system
  - name: infra-networking-core
    namespace: flux-system
  - name: infra-kubernetes-extra
    namespace: flux-system
  - name: infra-database-core
    namespace: flux-system
  interval: 15m0s
  path: ./apps/subsystems/ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: apps-ai
    namespace: flux-system
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      db_bootstrap_database: litellm
      # Which repository the vault's git committer pushes derived history to. Module
      # configuration, not a cluster-wide value, so it belongs here rather than in
      # cluster-secrets alongside dns_zone and the IP addresses. It has no default in
      # obsidian-tools -- a missing value fails the run at startup rather than silently
      # defaulting to something wrong.
      #
      # git_committer_remote_nas_url is deliberately not set. The NAS bare repository is a
      # second push target for independence insurance, and obsidian-tools treats it as
      # optional: with the variable absent the committer pushes to origin only and logs
      # which remotes are configured. Enabling it later means adding one line here, plus
      # the NAS-side setup (bare repo, authorized_keys, and its host key via
      # GIT_SSH_KNOWN_HOSTS_EXTRA, since it is published nowhere).
      git_committer_remote_origin_url: git@github.com:ppat/obsidian-vault.git
      db_bootstrap_owner: litellm
      db_name: litellm-db
      db_namespace: ai
      db_replicas: "2"
      db_storage_class: sc-longhorn-local-non-replicated
      db_storage_size: 10Gi
      db_suffix_current: "v20260723"
      db_suffix_restore: "v20260722"
      n8n_db_storage_size: 10Gi
      n8n_db_storage_class: sc-longhorn-local-non-replicated
      n8n_db_suffix_current: "v20260725"
      secret_store: bitwarden-secret-manager-store
      # see: https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-substitution-of-numbers-and-booleans
      quote: '"'
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
  patches:
  # TEMPORARY, and the port-back is tracked -- this is a prototype, not a destination.
  #
  # apps-ai v0.6.20 pins obsidian-tools 0.3.0, whose image cannot start: its virtualenv console
  # script carried a shebang naming the builder's interpreter path, so the container died with
  # `exec .../obsidian-tools failed: No such file or directory` and crashlooped every 15 minutes.
  # Fixed in ppat/obsidian-tools#33 and released as 0.3.1, which also adds a CI job that pulls the
  # published image and runs its entrypoint -- the check whose absence let 0.3.0 build, publish,
  # pass everything and deploy while being unable to exec.
  #
  # Patching here rather than waiting on an apps-ai release: the module change is one digest, and
  # the round trip is commit -> release -> tag -> bump before a broken CronJob stops failing.
  #
  # Retirement is TWO commits, not one. This patch *substitutes* a fix rather than neutralising
  # something, so bumping ref.tag and deleting the patch together leaves a window where the new
  # revision has not been fetched yet but the override is already gone -- straight back to the
  # unstartable image. Bump the tag first (this patch then sets the digest the module already
  # names, and is inert), then remove it once that revision has actually landed.
  # yamllint disable-line rule:indentation
  - patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: docker.io/ppatlabs/obsidian-tools:0.3.1@sha256:5f0b80fe3b447363004b2a03f6910f1cd8ff34e220c73ac0a07d9b717949bcf3
    target:
      group: batch
      version: v1
      kind: CronJob
      name: git-committer
      namespace: obsidian-vault
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/affinity
        value:
          podAntiAffinityType: required
    target:
      group: postgresql.cnpg.io
      kind: Cluster
  # components/db-backups and components/db-restore both patch `kind: Cluster` with no name
  # filter, so they also inject litellm's barman plugin config and recovery bootstrap into
  # n8n's Cluster (namespace n8n). n8n's DB has no backup store of its own yet (unbacked by
  # design for now -- see clusters#740), so undo that injection here and restore n8n's Cluster
  # to a plain initdb bootstrap. Drop this patch once n8n gets its own db-backups wiring.
  # yamllint disable-line rule:indentation
  - patch: |
      - op: remove
        path: /spec/plugins
      - op: remove
        path: /spec/externalClusters
      - op: remove
        path: /spec/bootstrap/recovery
      - op: add
        path: /spec/bootstrap/initdb
        value:
          database: ${n8n_db_bootstrap_database:=n8n}
          owner: ${n8n_db_bootstrap_owner:=n8n}
    target:
      group: postgresql.cnpg.io
      kind: Cluster
      namespace: n8n
  # openclaw.json's `${VAR}` tokens are expanded by OpenClaw from its own container env at
  # startup. Pulling the cluster-owned openclaw-plugin-secrets Secret in wholesale via envFrom
  # keeps adding a plugin credential a single-repo change -- add the key to that ExternalSecret
  # and reference `${VAR}` in openclaw.json -- instead of also editing the apps-ai module to
  # declare another secretKeyRef env entry. Strategic merge rather than JSON6902 so the
  # container is matched by name instead of by index; envFrom has no patch merge key and the
  # module's Deployment declares none, so this adds the list rather than replacing anything.
  # The Secret is read only at container start, and openclaw-config is generated with
  # disableNameSuffixHash, so neither a new key here nor a config edit rolls the pod on its
  # own -- restart the deployment after adding a credential.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openclaw
        namespace: openclaw
      spec:
        template:
          spec:
            containers:
            - name: openclaw
              envFrom:
              - secretRef:
                  name: openclaw-plugin-secrets
    target:
      group: apps
      version: v1
      kind: Deployment
      name: openclaw
      namespace: openclaw
  # The Grafana generator's spec.serviceAccount.secondsToLive exists in the external-secrets
  # CRD bundle the module targets, but not in the older CRD this cluster currently has
  # installed, so server-side apply rejects the whole Kustomization with "field not declared
  # in schema". Strip it here until the operator is upgraded.
  #
  # Cost of running without it: the generator mints a new token on every refresh and does not
  # delete the previous one, so tokens accumulate on the Grafana service account instead of
  # expiring on their own. Tolerable briefly, which is why this is a stopgap rather than a
  # change to the module -- remove this patch once the CRD carries the field.
  # yamllint disable-line rule:indentation
  - patch: |
      - op: remove
        path: /spec/serviceAccount/secondsToLive
    target:
      group: generators.external-secrets.io
      version: v1alpha1
      kind: Grafana
      name: mcp-grafana-token
      namespace: ai
