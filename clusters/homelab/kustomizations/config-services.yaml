---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config-services
  namespace: flux-system
spec:
  dependsOn:
  - name: infra-security-core
    namespace: flux-system
  - name: infra-networking-core
    namespace: flux-system
  interval: 15m0s
  path: ./clusters/homelab/services
  prune: true
  sourceRef:
    kind: GitRepository
    name: root
    namespace: flux-system
  # Git-declared, not imperative: root reconciles this Kustomization every 1m and re-applies
  # whatever git says, so an imperative `flux suspend` does not reliably hold (see prod-plan
  # OPEN-DECISIONS.md #13, Route B). Suspends loki-query-correctness delivery for the
  # MinIO->Garage cutover window (ppat/homelab-ops-kubernetes-apps#3611) -- QC fired hourly
  # into the downtime would both be noise and risk re-warming caches between a restart and a
  # cold run that must mean something. Reverted by the suspend-revert PR at close-out.
  suspend: true
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      # MUST match `loki_retention_size` in kustomizations/
      # infra-observability-core.yaml - that's the value that actually
      # governs the compactor's global retention_period; Flux has no
      # mechanism to reference one Kustomization's postBuild variable from
      # another, so this is a manually-maintained duplicate. Consumed by
      # loki-query-correctness's retention guard/expiry ledger (its
      # GLOBAL_RETENTION env var, see loki-query-correctness.py) to compute
      # when a baselined window's content stops being safely immutable -
      # a stale duplicate here makes that computation wrong silently. Update
      # both together - ci/scripts/check-loki-retention-pairing.sh (wired
      # into .github/workflows/static-analysis.yaml) fails CI if they drift.
      global_loki_retention: 30d
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
