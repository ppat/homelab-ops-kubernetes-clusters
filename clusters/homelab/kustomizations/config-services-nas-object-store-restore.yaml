---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config-services-nas-object-store-restore
  namespace: flux-system
spec:
  # CloudNativePG, its webhooks and the barman-cloud plugin come from infra-database-core;
  # external-secrets from infra-security-core.
  dependsOn:
  - name: infra-database-core
    namespace: flux-system
  - name: infra-security-core
    namespace: flux-system
  # Its own Kustomization rather than a directory under config-services: a new namespace, an
  # ExternalSecret and a recovering Cluster are all things an apply can refuse or fail, and
  # none of that may take down the shared umbrella that ai, dns, downloaders, logging,
  # longhorn-system, monitoring, tailscale and the trial's own sentinels reconcile through.
  #
  # `wait: false`: the Cluster is hibernated, so it will never report Ready. Ready here
  # means only "applied".
  wait: false
  interval: 15m0s
  path: ./clusters/homelab/services/nas-object-store-restore
  prune: true
  sourceRef:
    kind: GitRepository
    name: root
    namespace: flux-system
  timeout: 2m0s
  postBuild:
    # The one place the restore point is written, and the record of what restore 1
    # recovered to.
    #
    # Target: sentinel row id 164, written 2026-09-30T19:00:01Z, LSN 2A6/AC00BBF0, in WAL
    # segment 0000003D000002A6000000AC -- on the store by 20:10 that day (the WAL-continuity
    # exporter's tail was 2A6/B9). A fixed, already-archived row keeps the target valid
    # however late this merges. The row itself is on the far side of the stop: its lsn is
    # sampled before its own INSERT, so ids 1..163 must be present and 164 onwards absent.
    #
    # Base backup: the first one taken on the store (2026-09-24T04:00, end LSN
    # 29F/39000110), so the replay covers every segment archived there since the switch.
    substitute:
      restore_backup_id: "20260924T040000"
      restore_target_lsn: "2A6/AC00BBF0"
