---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-home-automation
  namespace: flux-system
spec:
  components:
  - ../../../components/sso
  - ../../../components/db-backups
  - ../../../components/db-restore
  dependsOn:
  - name: infra-security-extra
    namespace: flux-system
  - name: infra-storage-core
    namespace: flux-system
  - name: infra-networking-core
    namespace: flux-system
  - name: infra-database-core
    namespace: flux-system
  interval: 15m0s
  path: ./apps/subsystems/home-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: apps-home-automation
    namespace: flux-system
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      db_bootstrap_database: home-assistant
      db_bootstrap_owner: home-assistant
      db_name: home-automation-db
      db_namespace: home-automation
      db_replicas: "3"
      db_storage_class: sc-longhorn-local-non-replicated
      db_storage_size: 10Gi
      # REPLACE BEFORE MERGE with the generation the promotion restore creates.
      # Flipping this re-renders the ExternalName Service `home-automation-db`,
      # which is what Home Assistant's `db_uri` names -- so the application is
      # repointed without editing a secret and without touching a volume.
      db_suffix_current: "vYYYYMMDD"
      # The generation the promotion restore bootstraps *from*, consumed by
      # `components/db-restore` as the `serverName` of its `externalClusters`
      # entry. It has to move to the generation whose WAL chain is on versitygw;
      # left at 2025.07.03 the new cluster would try to recover from a server
      # path that exists only on MinIO.
      db_suffix_restore: "v20251018"
      secret_store: bitwarden-secret-manager-store
      # see: https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-substitution-of-numbers-and-booleans
      quote: '"'
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
  patches:
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/affinity
        value:
          podAntiAffinityType: required
    target:
      group: postgresql.cnpg.io
      kind: Cluster
  # Bind Home Assistant to the Longhorn volume restored from the versitygw
  # store. Only `claimName` moves: the pod-internal volume is still called
  # `home-assistant-data`, so all three volumeMounts that reference it --
  # including code-server's `subPath: .coder` -- are untouched.
  #
  # A name-keyed strategic merge rather than an index-addressed JSON6902 op.
  # `/spec/template/spec/volumes/0/...` is correct against the tag deployed when
  # this was written, and silently repoints the wrong volume the day the module
  # reorders that list. The merge key is the volume's name, which cannot drift.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: home-assistant
      spec:
        template:
          spec:
            volumes:
            - name: home-assistant-data
              persistentVolumeClaim:
                claimName: home-assistant-data-restored
    target:
      kind: Deployment
      name: home-assistant
