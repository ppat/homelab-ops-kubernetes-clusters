---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-home-automation
  namespace: flux-system
spec:
  components:
  - ../../../components/sso
  - ../../../components/db-backups
  - ../../../components/db-restore
  dependsOn:
  - name: infra-security-extra
    namespace: flux-system
  - name: infra-storage-core
    namespace: flux-system
  - name: infra-networking-core
    namespace: flux-system
  - name: infra-database-core
    namespace: flux-system
  interval: 15m0s
  path: ./apps/subsystems/home-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: apps-home-automation
    namespace: flux-system
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      # The one database on this estate whose backups go to versitygw rather
      # than MinIO, for the duration of the object-store trial. Every other
      # consumer keeps `s3.nas`, and that half is as much of the assertion as
      # this half: the point of parameterising the store per database was to be
      # able to move exactly one.
      #
      # Endpoint and credential move together and cannot be split. A store is
      # reached with its own key pair, so an endpoint moved on its own points at
      # a store that will not accept the request. The key names follow the
      # versitygw provisioner's own formula (`versitygw_<account>_accesskey` /
      # `_secretkey`), which is deliberately distinct from the
      # `cluster_nas_minio_*` formula so both stores' entries stay live through
      # the migration.
      #
      # Reverting these four lines is the rollback: it points the ObjectStore
      # back at MinIO within one reconcile, with `barmanObjectName` unchanged.
      # The MinIO objects are never touched by any of this.
      backup_s3_accesskeyid_key: versitygw_cloudnativepg_accesskey
      backup_s3_host: versitygw-s3.nas
      backup_s3_region: us-east-1
      backup_s3_secretkey_key: versitygw_cloudnativepg_secretkey
      db_bootstrap_database: home-assistant
      db_bootstrap_owner: home-assistant
      db_name: home-automation-db
      db_namespace: home-automation
      db_replicas: "3"
      db_storage_class: sc-longhorn-local-non-replicated
      db_storage_size: 10Gi
      # A new suffix is a new CloudNativePG Cluster, bootstrapped by
      # `components/db-restore` from the `db_suffix_restore` server path on the
      # backup store; the previous generation is left running (prune disabled).
      # Must match ^v[0-9]{8}$ and be unused both as a Cluster name and as a
      # server path on the store: an uppercase letter fails this whole
      # Kustomization, and the new generation archives under its own suffix.
      #
      # The new generation mints its own `-app` secret with a new password.
      # The PushSecret forwards it to the secret store within 10 minutes, but
      # the `home-automation-secrets` ExternalSecret re-reads it only every 24h,
      # so Home Assistant keeps the old password until that refresh or a forced
      # sync. The trial's CNPG sentinel names the `-app` secret directly and
      # moves with this suffix.
      db_suffix_current: "v20261001"
      db_suffix_restore: "v20251018"
      secret_store: bitwarden-secret-manager-store
      # see: https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-substitution-of-numbers-and-booleans
      quote: '"'
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
  patches:
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/affinity
        value:
          podAntiAffinityType: required
    target:
      group: postgresql.cnpg.io
      kind: Cluster
  # Runs Home Assistant on the Longhorn volume restored from the versitygw
  # store. Only `claimName` moves: the pod volume keeps its name, so all three
  # volumeMounts that reference it, code-server's `subPath: .coder` included,
  # are untouched. A name-keyed strategic merge, because an index-addressed
  # JSON6902 path repoints the wrong volume the day the module reorders the
  # list.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: home-assistant
      spec:
        template:
          spec:
            volumes:
            - name: home-assistant-data
              persistentVolumeClaim:
                claimName: home-assistant-data-restored
    target:
      kind: Deployment
      name: home-assistant
