---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-storage-core
  namespace: flux-system
spec:
  components:
  - ../../../components/oidc-credentials/minio
  - ../../../components/sso
  dependsOn:
  - name: infra-security-core
    namespace: flux-system
  interval: 15m0s
  path: ./infrastructure/subsystems/storage-core
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-storage-core
    namespace: flux-system
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      oidc_minio_app_name: minio-homelab
      oidc_minio_clientid_key: oidc_miniohomelab_clientid
      oidc_minio_clientsecret_key: oidc_miniohomelab_clientsecret
      secret_store: bitwarden-secret-manager-store
      minio_admin_username_key: cluster_homelab_minio_admin_username
      minio_admin_password_key: cluster_homelab_minio_admin_password
      # Garage rebuilt on plain Kubernetes resources, no operator/CRDs (apps#3611,
      # apps#3639) -- garage_replication_factor/garage_storage_replicas/
      # garage_storage_class/garage_metadata_size/garage_data_size/
      # garage_layout_capacity (variables the module carried at various points
      # during that rebuild) no longer exist on the module. garage-credentials
      # keys unchanged from the pre-#3639 design.
      #
      # cert_issuer: supplied ahead of the module version that requires it. An
      # upcoming storage-core release adds a dedicated cert-manager Certificate
      # for the Garage website Ingress's nested wildcard host
      # (*.garage-web.${domain_name}) -- Traefik's own default certificate only
      # covers one label of wildcard (*.${domain_name}), the same reason
      # coder/coder-tls-cert exists. That Certificate's issuerRef.name renders
      # from this variable, so it must already be here before ref.tag moves to
      # that release, or Flux's strict-mode envsubst fails the whole
      # Kustomization build -- taking MinIO and Longhorn down with it, since all
      # four components share this one Kustomization. This happened for real
      # (#902, reverted at #903): landing the variable first, while unused, means
      # the tag bump can never meet a cluster that lacks it. Matches what
      # apps-coder and infra-networking-core already pass here.
      cert_issuer: letsencrypt-production-issuer
      garage_admin_token_key: cluster_homelab_garage_admin_token
      garage_rpc_secret_key: cluster_homelab_garage_rpc_secret
      # Claim names for the externally-provisioned PVCs in
      # ../../storage/infra/pvc/garage-{metadata,data}.yaml -- this module never
      # provisions its own storage, matching every other module on this cluster.
      garage_metadata_claim: garage-metadata
      garage_data_claim: garage-data
      # Estate-wide S3 signing region (owner decision; also set for Loki already
      # in clusters#909's infra-observability-core.yaml, ahead of its own eventual
      # cutover to Garage): boto3's hardcoded default, already what
      # barman-cloud/CNPG backups sign with, and a value both MinIO and Garage
      # accept -- one region for every S3 consumer on this cluster instead of
      # three. Required: the module's conf.d/garage.toml has no default for this,
      # so an unsupplied value fails the Kustomization build loudly rather than
      # silently landing on something else. Garage rejects any S3 client whose
      # signed region doesn't match this exactly (AuthorizationHeaderMalformed).
      garage_s3_region: us-east-1
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
  patches:
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: minio-release
        namespace: minio
      spec:
        values:
          persistence:
            enabled: true
            existingClaim: minio-data
          securityContext:
            fsGroup: 65539
            fsGroupChangePolicy: "OnRootMismatch"
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: minio-release
      namespace: minio
  # yamllint disable-line rule:indentation
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: longhorn-release
        namespace: longhorn-system
      spec:
        chart:
          spec:
            # Deliberate hold, not an oversight: storage-core v0.3.0 bumps its default
            # Longhorn chart to 1.12.0, but this cluster runs 1.11.2 and the standing
            # practice here is to wait for a Longhorn `.1` release before adopting a new
            # minor. Chart 1.11.2 ships Longhorn appVersion v1.11.2 (confirmed against
            # charts.longhorn.io's index and this cluster's live longhorn-release
            # HelmRelease/Setting current-longhorn-version, both v1.11.2 as of writing) --
            # so this pin holds steady rather than upgrading. It must stay in the same
            # commit as any storage-core ref.tag bump that changes this default, and
            # should be removed once a Longhorn 1.12.1+ ships. Refs apps#3611.
            version: 1.11.2
        values:
          persistence:
            defaultClass: false
          defaultSettings:
            backupTarget: s3://nas-longhorn-backups@us-east-1/cluster-homelab/
            backupTargetCredentialSecret: backup-target-credentials
            defaultLonghornStaticStorageClass: sc-longhorn-replicated
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: longhorn-release
      namespace: longhorn-system
