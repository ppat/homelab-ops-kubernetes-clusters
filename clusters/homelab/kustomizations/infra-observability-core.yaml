---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-observability-core
  namespace: flux-system
spec:
  components:
  - ../../../components/oidc-credentials/grafana
  - ../../../components/sso
  dependsOn:
  - name: infra-security-core
    namespace: flux-system
  - name: infra-networking-core
    namespace: flux-system
  - name: infra-storage-core
    namespace: flux-system
  interval: 15m0s
  path: ./infrastructure/subsystems/observability-core
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra-observability-core
    namespace: flux-system
  # Git-declared, not imperative: root reconciles this Kustomization's parent every 1m and
  # re-applies whatever git says, so an imperative `flux suspend` does not reliably hold
  # (see prod-plan OPEN-DECISIONS.md #13, Route B). Suspends Loki's module for the
  # MinIO->Garage cutover window (ppat/homelab-ops-kubernetes-apps#3611). The flip PR clears
  # this back to false as part of its own change -- the resume rides the flip merge.
  suspend: false
  timeout: 2m0s
  wait: true
  postBuild:
    substitute:
      # must match the regular expression [0-9]+(ms|s|m|h) (milliseconds seconds minutes hours).
      alertmanager_retention_period: 168h
      alertmanager_storage_class: sc-longhorn-replicated
      alertmanager_storage_size: 2Gi
      # prometheus_retention_period overrides prometheus_retention_size
      # so set:
      #   * prometheus_retention_period = <desired retention period>
      # then tune prometheus_storage_size based on observed pv usage so that
      #   prometheus_retention_size = 70-80% x prometheus_storage_size
      # must match: should match '(^0|([0-9]*[.])?[0-9]+((K|M|G|T|E|P)i?)?B)$'
      prometheus_retention_size: 50GiB
      # 720h (30d) so the Garage-vs-MinIO trial (apps#3611) has a comparable 30-day
      # metrics window. Storage headroom checked, not assumed: prometheus_tsdb_storage_blocks_bytes
      # measured ~15.8GiB at 336h (2026-08-12), which projects to ~34GiB at 720h -- comfortably
      # inside both prometheus_retention_size (50GiB) and the 60Gi PV below, so storage is
      # unchanged here. See apps#3613 for why memory (not storage) is this cluster's actual
      # constraint at 30d retention.
      prometheus_retention_period: 720h
      prometheus_storage_class: sc-longhorn-replicated
      prometheus_storage_size: 60Gi
      prometheus_volume_name: pv-prometheus
      # Pre-existing defect (apps#3613): measured 2026-08-12 at 99.9% of the module's
      # previously-hardcoded 2Gi limit (max_over_time(container_memory_working_set_bytes{
      # container="prometheus"}[14d]) = 1.9975GiB), and a 30-day range query over ~349k head
      # series risks an OOMKill at that margin.
      #
      # This ceiling is reached by TSDB compaction rather than by query load, so it scales with
      # series count and tightens on its own as the estate grows.
      prometheus_memory_request: 2Gi
      prometheus_memory_limit: 8Gi
      loki_storage_class: sc-longhorn-replicated
      # MUST match `global_loki_retention` in kustomizations/config-services.yaml - see
      # that file's comment for why it's a manually-maintained duplicate rather than a
      # cross-Kustomization reference, and ci/scripts/check-loki-retention-pairing.sh for
      # the CI check that fails if they drift.
      loki_retention_size: 30d
      # each of the 3 monolithic replicas combines the write/read/backend roles that SimpleScalable
      # split across dedicated nodes - size for the write-path buffer (previously the write node's
      # 16Gi), not the old singleBinary default, since every replica now does that work too.
      loki_singlebinary_storage_size: 16Gi
      loki_results_cache_memory: "1024"
      loki_chunks_cache_memory: "4096"
      # Required as of apps-v0.29.0 (apps#3618) -- the module no longer hardcodes these
      # Bitwarden key names, so every consumer must supply them explicitly. These three
      # preserve today's behaviour exactly (Loki stays on MinIO); they only change when
      # Loki cuts over to Garage (apps#3611).
      loki_s3_endpoint_key: cluster_homelab_garage_loki_endpoint
      loki_s3_accesskeyid_key: garage_key_loki_accesskey
      loki_s3_secretkey_key: garage_key_loki_secretkey
      # us-east-1 is the estate-wide S3 signing region (owner decision): boto3's hardcoded
      # default, already what barman-cloud/CNPG backups sign with, and a value both MinIO and
      # Garage accept -- one region for every S3 consumer on this cluster instead of three.
      # This is set now, not deferred to the Garage cutover the way the three keys above are:
      # MinIO ignores the signed region entirely (grafana/loki#11453), so us-east-1 behaves
      # exactly like the previous empty default against it today, and it's the same value
      # Garage will be configured with -- so, unlike those three, this needs no revert and no
      # re-visit at cutover. That supersedes this line's own earlier reasoning (see git
      # history), which deferred it on the assumption the eventual region was still unknown.
      # Proving it now instead of at cutover matters because a region mismatch crashloops
      # Loki's compactor immediately with no client-side recovery (apps#3611 comment
      # 5282296514; reproduced live on sandbox-talos's logging/loki-0). Discovering that
      # during the actual cutover window would be the worst time to find it; proving it now
      # against a lenient MinIO is free.
      loki_s3_region: us-east-1
      # `getent group systemd-journal` on minisforum-nab9-1 (2026-08-11). The GID is
      # allocated per host, not a fixed constant - a rebuilt node or a newly-added node
      # could land on a different value, which fails *silently* (journal tailer reports
      # healthy, collects zero entries). Re-derive per node before trusting this value
      # elsewhere; see the per-node verification query in the PR description.
      systemd_journal_gid: "999"
      # see: https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-substitution-of-numbers-and-booleans
      quote: '"'
      secret_store: bitwarden-secret-manager-store
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
  patches:
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /subsets/0/addresses/-
        value: {ip: 192.168.8.64}
      - op: add
        path: /subsets/0/addresses/-
        value: {ip: 192.168.8.65}
      - op: add
        path: /subsets/0/addresses/-
        value: {ip: 192.168.8.67}
      - op: add
        path: /subsets/0/addresses/-
        value: {ip: 192.168.8.68}
      - op: add
        path: /subsets/0/addresses/-
        value: {ip: 192.168.8.69}
    target:
      kind: Endpoints
      name: k3s-metrics-service
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/values/prometheus/prometheusSpec/storageSpec/volumeClaimTemplate/metadata/labels
        value:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/default: enabled
          recurring-job-group.longhorn.io/snapshot-ops: enabled
          recurring-job-group.longhorn.io/backup-ops: enabled
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: kube-prometheus-stack-release
      namespace: monitoring
  # Route alerts to n8n's Alertmanager-intake webhook (apps-ai's alertmanager-receiver
  # workflow) instead of the chart's default null receiver -- Alertmanager otherwise has
  # zero receivers configured. Watchdog stays routed to 'null' so the dead-man's-switch
  # heartbeat doesn't spam the webhook. Inert until that n8n workflow is manually imported
  # and activated (clusters#740) -- until then this just posts to a 404.
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/values/alertmanager/config
        value:
          global:
            resolve_timeout: 5m
          inhibit_rules:
          - source_matchers:
            - 'severity = critical'
            target_matchers:
            - 'severity =~ warning|info'
            equal:
            - 'namespace'
            - 'alertname'
          - source_matchers:
            - 'severity = warning'
            target_matchers:
            - 'severity = info'
            equal:
            - 'namespace'
            - 'alertname'
          - source_matchers:
            - 'alertname = InfoInhibitor'
            target_matchers:
            - 'severity = info'
            equal:
            - 'namespace'
          - target_matchers:
            - 'alertname = InfoInhibitor'
          route:
            group_by: ['namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: 'n8n-webhook'
            routes:
            - receiver: 'null'
              matchers:
              - alertname = "Watchdog"
          receivers:
          - name: 'null'
          - name: 'n8n-webhook'
            webhook_configs:
            - url: 'http://n8n.n8n.svc.cluster.local:5678/webhook/alertmanager'
          templates:
          - '/etc/alertmanager/config/*.tmpl'
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: kube-prometheus-stack-release
      namespace: monitoring
  # Mount the kubelet pod directory so the collector can reach the CSI-mounted PVCs of
  # other pods (see the cluster-pvc-logs.alloy patch below). mountPropagation is not
  # optional: kubelet creates each pod's CSI mount *after* this container's own bind
  # mount exists, and under the default (None/private) propagation those later mounts
  # stay invisible here forever - the globs then match nothing, with no error and no
  # unhealthy component. That is the promtail bug fixed in #883; this must not repeat it.
  # yamllint disable-line rule:indentation
  - patch: |
      - op: add
        path: /spec/values/controller/volumes/extra/-
        value:
          name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
      - op: add
        path: /spec/values/alloy/mounts/extra/-
        value:
          name: kubelet-pods
          mountPath: /var/lib/kubelet/pods
          readOnly: true
          mountPropagation: HostToContainer
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: alloy-release
      namespace: logging
  # Labels this cluster's own Loki streams so they're distinguishable from nas's once
  # both write into the same Loki (nas remote-writes here as of clusters#1039).
  # K8S_CLUSTER_LABEL is the module's one sanctioned opt-in label
  # addition (see the module README) - setting it re-mints every stream's identity, but
  # every retention_stream selector in this repo subset-matches on existing labels
  # rather than asserting an exact set, so it keeps matching. No LOKI_WRITE_URL: this
  # collector keeps writing to the in-cluster Loki it already targets by default.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: alloy-release
        namespace: logging
      spec:
        values:
          alloy:
            extraEnv:
            - name: K8S_CLUSTER_LABEL
              value: homelab
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: alloy-release
      namespace: logging
  # Same label, independent seam - the event singleton reads K8S_CLUSTER_LABEL through
  # its own loki.write block and is not affected by any patch on alloy-release.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: alloy-events-release
        namespace: logging
      spec:
        values:
          alloy:
            extraEnv:
            - name: K8S_CLUSTER_LABEL
              value: homelab
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: alloy-events-release
      namespace: logging
  # The three PVC-tailing log jobs this cluster owns, added as an extra key in the
  # module's alloy-config ConfigMap - the extension seam its README documents. Alloy
  # loads /etc/alloy as a directory, so this file joins the module's own *.alloy files
  # in one component graph; the cluster_ name prefix keeps it collision-free.
  #
  # The body below is a verbatim copy of
  # clusters/homelab/services/logging/conf.d/cluster-pvc-logs.alloy. It is duplicated
  # because a Flux patch is inline-only and cannot reference a file; edit that file, not
  # this copy - `ci/scripts/alloy-lint.sh check-embedded` fails when the two differ.
  # yamllint disable-line rule:indentation
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: alloy-config
        namespace: logging
      data:
        cluster-pvc-logs.alloy: |
          // Cluster-owned log collection jobs for three apps that write their logs into a
          // CSI-mounted PVC instead of stdout. They are read on the node, through the pod's
          // own kubelet directory, so they are invisible to the module's /var/log/pods job.
          //
          // Read before editing:
          //
          //   - This file is the source of truth, but it is not what Flux applies. A Flux
          //     Kustomization's spec.patches are inline-only, so a verbatim copy of this file
          //     is embedded in clusters/homelab/kustomizations/infra-observability-core.yaml,
          //     which is how it reaches the module's alloy-config ConfigMap and thereby
          //     /etc/alloy. `ci/scripts/alloy-lint.sh check-embedded` fails if the two drift.
          //   - Every *.alloy file in /etc/alloy shares one component namespace, so
          //     cluster-supplied components must carry the `cluster_` prefix the module
          //     requires. A duplicate name fails the whole config load, not just this file --
          //     and it fails asymmetrically: a running collector rejects a bad reload with a
          //     400 and keeps its last valid config, while a fresh pod exits. A broken
          //     fragment therefore stays invisible until the DaemonSet next rolls, then takes
          //     out log collection node by node.
          //   - These streams deliberately carry no `job` label, unlike the module's pod-log
          //     job. That is inherited from the promtail jobs they replace; adding one would
          //     change the identity of series that already exist in Loki.
          //   - `file_match` is required on every loki.source.file here: without it
          //     loki.source.file os.Stat()s __path__ literally and a glob matches nothing,
          //     with no error and no unhealthy component.

          // ----------------------------------------------------------------------------------
          // pihole -- *.log at the root of its CSI volume
          // ----------------------------------------------------------------------------------

          discovery.relabel "cluster_pihole_pvc_logs" {
          	targets = discovery.kubernetes.pods.targets

          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          		regex         = "pihole"
          	}

          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		regex         = "pihole"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_uid"]
          		replacement   = "/var/lib/kubelet/pods/$1/volumes/kubernetes.io~csi/*/mount/*.log"
          		target_label  = "__path__"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_name",
          			"__meta_kubernetes_pod_label_app",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "app"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_instance",
          			"__meta_kubernetes_pod_label_instance",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "instance"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_component",
          			"__meta_kubernetes_pod_label_component",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "component"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_node_name"]
          		target_label  = "node_name"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_namespace"]
          		target_label  = "namespace"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_name"]
          		target_label  = "pod"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		target_label  = "container"
          	}
          }

          loki.source.file "cluster_pihole_pvc_logs" {
          	targets    = discovery.relabel.cluster_pihole_pvc_logs.output
          	forward_to = [loki.process.cluster_pihole_pvc_logs.receiver]

          	file_match {
          		enabled = true
          	}
          }

          loki.process "cluster_pihole_pvc_logs" {
          	forward_to = [loki.write.default.receiver]

          	// Reduce the filename label to the path within the volume; the kubelet prefix is
          	// per-pod and would make every stream unique across restarts.
          	stage.regex {
          		source     = "filename"
          		expression = ".*/kubernetes.io~csi/[^/]+/mount/(?P<clean_filename>.*)"
          	}

          	stage.labels {
          		values = {
          			filename = "clean_filename",
          		}
          	}
          }

          // ----------------------------------------------------------------------------------
          // plex -- *.log at the CSI volume root, or one level down in a named subdirectory
          // ----------------------------------------------------------------------------------

          discovery.relabel "cluster_plex_pvc_logs" {
          	targets = discovery.kubernetes.pods.targets

          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          		regex         = "plex"
          	}

          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		regex         = "plex"
          	}

          	// The middle `*` matches the pod's CSI volume by PersistentVolume name, which this
          	// job deliberately does not pin -- plex-logs is dynamically provisioned, so its PV
          	// name is generated and would change (silently stopping collection) if the volume
          	// were ever recreated.
          	//
          	// Do not widen `{*,*/*}` back to `**`: this pod also mounts its 32Gi config volume
          	// and the entire read-only media library through the same kubernetes.io~csi/
          	// prefix, and `**` recursively re-walks all three on every file_match sync_period,
          	// not just plex-logs -- that walk measured ~740m CPU sustained on the node this pod
          	// lands on (vs 17-52m for the DaemonSet's other pods), from a glob that did less
          	// useful work than its peers while doing it. `{*,*/*}` is a doublestar alternation
          	// bounded to the two depths plex actually writes logs at: the volume root, and one
          	// named subdirectory (`PMS Plugin Logs/`). It deliberately excludes the crash
          	// report file several levels deep in the *config* volume (Library/Application
          	// Support/Plex Media Server/Crash Reports/...): that's a diagnostic dump from the
          	// wrong volume, not a log this job is meant to collect, and reaching it would mean
          	// either pinning the config volume's PV name or re-adding the expensive recursive
          	// walk this change removes.
          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_uid"]
          		replacement   = "/var/lib/kubelet/pods/$1/volumes/kubernetes.io~csi/*/mount/{*,*/*}.log"
          		target_label  = "__path__"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_name",
          			"__meta_kubernetes_pod_label_app",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "app"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_instance",
          			"__meta_kubernetes_pod_label_instance",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "instance"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_component",
          			"__meta_kubernetes_pod_label_component",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "component"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_node_name"]
          		target_label  = "node_name"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_namespace"]
          		target_label  = "namespace"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_name"]
          		target_label  = "pod"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		target_label  = "container"
          	}
          }

          loki.source.file "cluster_plex_pvc_logs" {
          	targets    = discovery.relabel.cluster_plex_pvc_logs.output
          	forward_to = [loki.process.cluster_plex_pvc_logs.receiver]

          	// Defence-in-depth alongside the bounded glob above: these are tailed files, not a
          	// once-per-period scrape, so a slower re-glob only delays *new* files/pods showing
          	// up, by up to a minute -- not a problem for logs nothing alerts on. A future glob
          	// mistake here (or a fourth volume added to the pod) re-walks less often.
          	file_match {
          		enabled     = true
          		sync_period = "1m"
          	}
          }

          loki.process "cluster_plex_pvc_logs" {
          	forward_to = [loki.write.default.receiver]

          	stage.regex {
          		source     = "filename"
          		expression = ".*/kubernetes.io~csi/[^/]+/mount/(?P<clean_filename>.*)"
          	}

          	stage.labels {
          		values = {
          			filename = "clean_filename",
          		}
          	}
          }

          // ----------------------------------------------------------------------------------
          // traefik -- one access.log per pod on a shared RWX volume, so the pod name is part
          // of the path and every pod's collector would otherwise see all of them
          // ----------------------------------------------------------------------------------

          discovery.relabel "cluster_traefik_access_rwx_logs" {
          	targets = discovery.kubernetes.pods.targets

          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          		regex         = "traefik"
          	}

          	// Excludes the log-rotate sidecar, which shares the volume.
          	rule {
          		action        = "keep"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		regex         = "traefik"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_name"]
          		separator     = ";"
          		regex         = "(.+);(.+)"
          		replacement   = "/var/lib/kubelet/pods/$1/volumes/kubernetes.io~csi/*/mount/$2/access.log"
          		target_label  = "__path__"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_name",
          			"__meta_kubernetes_pod_label_app",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "app"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_instance",
          			"__meta_kubernetes_pod_label_instance",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "instance"
          	}

          	rule {
          		action        = "replace"
          		source_labels = [
          			"__meta_kubernetes_pod_label_app_kubernetes_io_component",
          			"__meta_kubernetes_pod_label_component",
          		]
          		regex        = "^;*([^;]+)(;.*)?$"
          		target_label = "component"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_node_name"]
          		target_label  = "node_name"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_namespace"]
          		target_label  = "namespace"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_name"]
          		target_label  = "pod"
          	}

          	rule {
          		action        = "replace"
          		source_labels = ["__meta_kubernetes_pod_container_name"]
          		target_label  = "container"
          	}
          }

          loki.source.file "cluster_traefik_access_rwx_logs" {
          	targets    = discovery.relabel.cluster_traefik_access_rwx_logs.output
          	forward_to = [loki.process.cluster_traefik_access_rwx_logs.receiver]

          	file_match {
          		enabled = true
          	}
          }

          loki.process "cluster_traefik_access_rwx_logs" {
          	forward_to = [loki.write.default.receiver]

          	// drop_malformed discards the rotation marker lines the log-rotate sidecar
          	// writes, which are not JSON.
          	stage.json {
          		expressions = {
          			timestamp = "time",
          			status    = "DownstreamStatus",
          			method    = "RequestMethod",
          		}
          		drop_malformed = true
          	}

          	// One directory deeper than the other two jobs: the pod name sits between the
          	// volume root and the file.
          	stage.regex {
          		source     = "filename"
          		expression = ".*/kubernetes.io~csi/[^/]+/mount/.*/(?P<clean_filename>.*)"
          	}

          	stage.labels {
          		values = {
          			status   = "status",
          			method   = "method",
          			filename = "clean_filename",
          		}
          	}

          	stage.timestamp {
          		source = "timestamp"
          		format = "RFC3339"
          	}
          }
    target:
      kind: ConfigMap
      name: alloy-config
      namespace: logging
