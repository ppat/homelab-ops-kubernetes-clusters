---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- vault-data.yaml
- vault-git-cache.yaml
- obsidian-vault-nats-jetstream.yaml

patches:
# vault-data holds the authoritative markdown content and obsidian-vault-nats-jetstream
# holds acknowledged-but-unapplied queue messages. The queue is not a cache: local-replicator
# deletes a spool entry on JetStream ack and the next replication cycle overwrites the device
# copy it captured, so an acked drift message that dies with this volume has no third copy
# anywhere. Both take the full group set.
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: irrelevant
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/default: enabled
        recurring-job-group.longhorn.io/snapshot-ops: enabled
        recurring-job-group.longhorn.io/backup-ops: enabled
  target:
    kind: PersistentVolumeClaim
    name: '^(vault-data|obsidian-vault-nats-jetstream)$'
# vault-git-cache only holds the committer's clone of vault git history/state —
# it's re-derivable with a fresh `git clone` from the remotes it pushes to, so
# unlike the other PVCs here it skips snapshot-ops/backup-ops (nothing to
# protect) and keeps only the default group's filesystem-trim housekeeping.
# Same reasoning as the wyoming-* model caches in storage/apps/pvc/home-automation.
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: irrelevant
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/default: enabled
  target:
    kind: PersistentVolumeClaim
    name: vault-git-cache
