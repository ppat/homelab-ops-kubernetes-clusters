---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-data
  namespace: downloaders
  labels:
    app.kubernetes.io/name: recyclarr
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: sc-longhorn-replicated
  resources:
    requests:
      storage: 3Gi
  volumeMode: Filesystem
