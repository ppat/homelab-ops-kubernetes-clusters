---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- autobrr-data.yaml
- bazarr-data.yaml
- lidarr-data.yaml
- media.yaml
- prowlarr-data.yaml
- qbittorrent-data.yaml
- qui-data.yaml
- radarr-data.yaml
- recyclarr-data.yaml
- sabnzbd-data.yaml
- seerr-data.yaml
- sonarr-data.yaml

patches:
# yamllint disable-line rule:indentation
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: irrelevant
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/default: enabled
        recurring-job-group.longhorn.io/snapshot-ops: enabled
        recurring-job-group.longhorn.io/backup-ops: enabled
  target:
    kind: PersistentVolumeClaim
    name: '^.+-data$'
# recyclarr-data is only attached while its CronJob runs. Longhorn never attaches a detached volume
# for a trim, so it moves from default (which carries weekly-filesystem-trim) to no-trim, a group no
# trim job references. It keeps its snapshots and backups, which do auto-attach.
# yamllint disable-line rule:indentation
- patch: |-
    - op: remove
      path: /metadata/labels/recurring-job-group.longhorn.io~1default
    - op: add
      path: /metadata/labels/recurring-job-group.longhorn.io~1no-trim
      value: enabled
  target:
    kind: PersistentVolumeClaim
    name: recyclarr-data
