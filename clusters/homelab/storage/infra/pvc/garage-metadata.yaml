---
# Sized from the H1 falsification run (apps#3611): metadata_dir measured 6361.8 MiB
# at 3,439,460 objects. 16Gi is ~2.5x that figure for headroom -- Garage's LMDB
# metadata store grows with object *count*, not object size, so this is the volume
# to watch as the bucket's item count grows, independent of garage-data's own growth.
#
# Losing Garage's node identity/cluster layout (this volume) is as disruptive as losing
# object data, so it gets the same backup schedule as garage-data. Its Longhorn
# recurring-job labels are set by a garage-metadata-specific patch in
# storage/infra/pvc/kustomization.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-metadata
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 16Gi
  storageClassName: sc-longhorn-replicated
  volumeMode: Filesystem
  volumeName: pvc-22f7d36d-74dd-498a-9148-1d259b6bbf62
