---
# Static export the nfs-canary-nfs-share storage canary writes to. sc-nfs-share is only ever
# consumed through static PersistentVolumes like this one, so that is what the canary checks:
# mount, write with fsync, read back. The share is the dedicated Synology shared folder
# kubernetes-health-canary; each run writes and removes one file named after its pod, so the
# homelab and nas canaries can share it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-nfs-share-health-canary-homelab
  annotations:
    pv.kubernetes.io/provisioned-by: nfs.csi.k8s.io
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 1Gi
  csi:
    driver: nfs.csi.k8s.io
    # volumeHandle format: {nfs-server-address}#{sub-dir-name}#{share-name}
    # make sure this value is unique for every share in the cluster
    volumeHandle: ${ipaddress_nfs}#volume1#kubernetes-health-canary#rwx
    volumeAttributes:
      server: ${ipaddress_nfs}
      share: /volume1/kubernetes-health-canary
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sc-nfs-share
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-canary-nfs-share
  namespace: health-canary
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      # must match the capacity of the PersistentVolume above
      storage: 1Gi
  storageClassName: sc-nfs-share
  volumeName: static-nfs-share-health-canary-homelab
