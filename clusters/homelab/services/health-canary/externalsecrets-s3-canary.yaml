---
# Credentials for the S3 canaries in kustomizations/infra-observability-health-canaries.yaml,
# one per endpoint. Each key is scoped to that endpoint's health-canary bucket and is created
# by homelab-ops-terraform (garage-homelab and versitygw-nas workspaces), which also
# writes these Bitwarden entries under its own naming formula per store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-canary-garage
  namespace: health-canary
spec:
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: garage_key_healthcanary_accesskey
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: garage_key_healthcanary_secretkey
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-canary-versitygw-nas
  namespace: health-canary
spec:
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: versitygw_healthcanary_accesskey
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: versitygw_healthcanary_secretkey
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
