---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
- name: grafana-extra-config
  namespace: monitoring
  files:
  - conf.d/grafana-dashboards.yaml
  options:
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
    disableNameSuffixHash: true
- name: dashboard-spegel
  namespace: monitoring
  files:
  - dashboards/spegel.json
  options:
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
    labels:
      grafana_dashboard: "1"
    disableNameSuffixHash: true
- name: dashboard-prometheus-tuning
  namespace: monitoring
  files:
  - dashboards/prometheus-tuning.json
  options:
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
    labels:
      grafana_dashboard: "1"
    disableNameSuffixHash: true
- name: dashboard-sandbox-vm-egress
  namespace: monitoring
  files:
  - dashboards/sandbox-vm-egress.json
  options:
    annotations:
      grafana_folder: Sandbox VMs
      kustomize.toolkit.fluxcd.io/substitute: disabled
    labels:
      grafana_dashboard: "1"
    disableNameSuffixHash: true
- name: dashboard-sandbox-vm-ingress
  namespace: monitoring
  files:
  - dashboards/sandbox-vm-ingress.json
  options:
    annotations:
      grafana_folder: Sandbox VMs
      kustomize.toolkit.fluxcd.io/substitute: disabled
    labels:
      grafana_dashboard: "1"
    disableNameSuffixHash: true
- name: dashboard-ci-diagnostics
  namespace: monitoring
  files:
  - dashboards/ci-diagnostics.json
  options:
    annotations:
      # Not about anything this cluster runs -- it reads a CI series scraped from GitHub --
      # so it gets its own folder rather than sitting among the cluster dashboards.
      grafana_folder: CI
      # Mandatory. This JSON is full of bare $datasource, $suite, $population, $window,
      # $search and $__interval references, and Flux's post-build substitution expands bare
      # $name as well as ${name}. Without this, every one becomes an empty string and the
      # dashboard loads cleanly with every panel silently selecting nothing.
      kustomize.toolkit.fluxcd.io/substitute: disabled
    labels:
      grafana_dashboard: "1"
    disableNameSuffixHash: true
- name: snmp-exporter-extra-config
  namespace: monitoring
  files:
  - conf.d/scrape-configs.yaml
  options:
    disableNameSuffixHash: true
