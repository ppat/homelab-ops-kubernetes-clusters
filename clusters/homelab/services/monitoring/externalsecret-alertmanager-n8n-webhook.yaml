---
# Bearer token for Alertmanager's n8n-immediate receiver (kustomizations/infra-observability-core.yaml),
# checked by n8n's alertmanager-immediate workflow. It is the openclaw_hooks_token key that
# n8n-workflow-secrets (services/ai/n8n) builds n8n's credentials from, so the two cannot drift
# apart. The Alertmanager CR mounts this Secret at /etc/alertmanager/secrets/alertmanager-n8n-webhook/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-n8n-webhook
  namespace: monitoring
spec:
  data:
  - secretKey: token
    remoteRef:
      key: openclaw_hooks_token
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
