---
# A copy of the versitygw credential `home-automation-db-backup-credentials` carries, not a
# reference to it: the barman-cloud plugin resolves the ObjectStore and its credential in
# the recovering Cluster's own namespace, and Secrets do not cross namespaces.
#
# Requires `campaign-restore` on `ClusterSecretStore/bitwarden-secret-manager-store`'s
# namespace allowlist (`cluster/secrets/bitwarden-secret-store.yaml`). Store name is
# hardcoded because this Kustomization defines no `${secret_store}`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: campaign-restore-credentials
  namespace: campaign-restore
spec:
  data:
  - secretKey: access_key_id
    remoteRef:
      key: versitygw_cloudnativepg_accesskey
  - secretKey: secret_key
    remoteRef:
      key: versitygw_cloudnativepg_secretkey
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      metadata:
        annotations: {}
        labels:
          cnpg.io/reload: "1"
      data:
        s3_accesskeyid: "{{ .access_key_id }}"
        s3_secretaccesskey: "{{ .secret_key }}"
        # A literal, because the plugin's only region input is a SecretKeySelector. Must
        # equal the gateway's VGW_REGION, exactly as the live credential does.
        s3_region: "us-east-1"
