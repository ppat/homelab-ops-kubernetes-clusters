---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- externalsecret-restore-credentials.yaml
- objectstore-restore-source.yaml
- cluster-restore.yaml
- job-verify-restore.yaml

configMapGenerator:
- name: campaign-restore-verify-script
  namespace: campaign-restore
  files:
  - verify-restore.sh
  options:
    annotations:
      # The script is full of shell `${...}` expansions that Flux post-build substitution
      # would otherwise blank. Its inputs arrive as environment variables on the Job, which
      # is where the substitution is meant to happen.
      kustomize.toolkit.fluxcd.io/substitute: disabled
    # Flux prune is disabled cluster-wide, so a hashed name would strand an orphan per edit.
    disableNameSuffixHash: true
