---
# Credentials for the n8n workflows in ./workflows, owned here because those workflows are
# specific to this cluster. The apps-ai module's n8n Deployment takes this Secret wholesale as an
# optional envFrom, and Reloader rolls n8n when it changes.
#
# CREDENTIALS_OVERWRITE_DATA is n8n's credential-overwrite JSON: n8n fills every credential of a
# given type with the values listed for that type. That is why each service the workflows talk to
# uses a different credential type (see workflows/README.md); a new service needs a new type, or
# it shares these values. n8n reads the name without the usual N8N_ prefix.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-workflow-secrets
  namespace: n8n
spec:
  data:
  # The same token openclaw's hooks.token is set from, so the two cannot drift apart.
  - secretKey: openclaw_hooks_token
    remoteRef:
      key: openclaw_hooks_token
  - secretKey: smtp_user
    remoteRef:
      key: n8n_smtp_user
  - secretKey: smtp_password
    remoteRef:
      key: n8n_smtp_password
  - secretKey: health_pages_password
    remoteRef:
      key: n8n_health_pages_password
  # Created by Terraform (homelab-ops-terraform workspaces/litellm/key-health-triage.tf).
  - secretKey: litellm_health_triage_key
    remoteRef:
      key: apikey_litellm_healthtriage
  target:
    template:
      engineVersion: v2
      data:
        CREDENTIALS_OVERWRITE_DATA: |-
          {
          "httpBearerAuth": {"token": {{ .openclaw_hooks_token | toJson }}},
          "httpHeaderAuth": {"name": "Authorization", "value": {{ printf "Bearer %s" .openclaw_hooks_token | toJson }}},
          "httpBasicAuth": {"user": "health", "password": {{ .health_pages_password | toJson }}},
          "openAiApi": {"apiKey": {{ .litellm_health_triage_key | toJson }}, "url": "http://litellm.ai.svc.cluster.local:4000/v1"},
          "smtp": {"host": "smtp.${domain_name}", "port": 587, "secure": false,
          "user": {{ .smtp_user | toJson }}, "password": {{ .smtp_password | toJson }}}
          }
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
