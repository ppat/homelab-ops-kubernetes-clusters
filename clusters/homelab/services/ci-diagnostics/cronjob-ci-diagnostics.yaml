---
# Keeps the chainsaw suites' published diagnostics grammar past the 90 days GitHub keeps
# job logs. See ci-diagnostics.py for what it stores and why, and README.md in this
# directory for what must exist before it can run.
#
# The direction is the design: this pulls from the homelab into Loki. There is no inbound
# path, no CI-side secret, and CI stays ignorant that it exists -- a CI->homelab push was
# considered and rejected. Do not invert it.
#
# Cluster-specific, not a module: nothing else would consume this at a different version
# with different patches, and retiring it is deleting this directory rather than cutting a
# module release. Same reasoning as loki-query-correctness next door -- see
# clusters/homelab/README.md#cluster-specific-services.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-diagnostics
  namespace: ci-diagnostics
  labels:
    app.kubernetes.io/name: ci-diagnostics
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 8
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ci-diagnostics
    spec:
      # Deliberately shorter than the schedule interval, so a long pass is cut off rather
      # than colliding with the next one under concurrencyPolicy: Forbid. Being cut off is
      # safe here and is a designed property, not a tolerated one: work is pushed per
      # suite, and the next pass rebuilds its to-do list by set difference against what
      # Loki already holds, so an interrupted run simply resumes. That is also what makes
      # the first 90-day backfill safe without a separate mode -- it just takes several
      # passes to catch up.
      activeDeadlineSeconds: 3000
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ci-diagnostics
        spec:
          # Nothing here touches the Kubernetes API -- only api.github.com and Loki.
          automountServiceAccountToken: false
          containers:
          - name: ci-diagnostics
            image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
            # -B because /scripts is mounted read-only and CPython would otherwise try to
            # write __pycache__ beside the script on every run.
            command: ["python3", "-B", "/scripts/ci-diagnostics.py"]
            env:
            - name: GITHUB_REPO
              value: ppat/homelab-ops-kubernetes-apps
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ci-diagnostics-secrets
                  key: GITHUB_TOKEN
            # Trailing dot is deliberate and matches every other Loki client in this
            # estate: it makes the name fully qualified and skips ndots search-domain
            # expansion. Load-bearing on this image -- Kyverno's add-ndots mutation forces
            # ndots:1, and musl (alpine) does not fall back to the search list once a name
            # has as many dots as ndots. Do not "clean it up".
            # Curated landing dates, rendered as annotations on the dashboard. Version
            # controlled here, beside the manifests, rather than derived from `sha` -- `sha`
            # moves on every Renovate merge and would mark noise daily, burying the handful of
            # changes anyone actually wants to read a trend against.
            #
            # Dates are the PR merge dates. Add a line when something lands that a future
            # before/after would need to straddle; a handful a year is the expected rate.
            - name: LANDING_MARKERS
              value: >-
                2026-08-15=composable prerequisite fixtures (#3693);
                2026-08-16=node-count consolidation to single-node (#3713-#3716);
                2026-08-17=MODE emitter lands (#3738), before this there are no MODE lines
            - name: LOKI_BASE_URL
              value: http://loki.logging.svc.cluster.local.:3100
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            # Measured, not guessed. Three numbers, all from real logs on 2026-08-17:
            #
            #   ~9 MiB of Python objects per 1000 buffered entries, ~70 entries per job
            #   real run, 40 job logs   peak RSS 44.8 MiB, RssAnon 30.7 MiB
            #   20 MiB job log          +0.0 MiB RssAnon (streamed off disk)
            #
            # Two changes got it here, and neither was "ask for more memory":
            #
            # - FLUSH_EVERY_ENTRIES bounds the buffer, so peak no longer scales with
            #   MAX_LOG_FETCHES. Measured flat at ~30 MiB from 6k entries through 77k. It
            #   was previously unbounded: 1200 logs would have been ~84k entries, ~760 MiB.
            # - Job logs are spooled to the disk-backed emptyDir below and parsed a line at
            #   a time, so a pathological log costs **reclaimable page cache** instead of
            #   anonymous memory. Measured on a synthetic 20 MiB log: RssAnon unchanged at
            #   9.9 MiB streaming, against a 70 MiB peak reading it whole. That matters more
            #   than the number, because anonymous memory is unreclaimable without swap --
            #   the kernel's only response to pressure is an OOM kill, whereas page cache it
            #   can simply drop.
            #
            # An earlier revision asked for 256Mi/512Mi on a guess, which was wrong in both
            # directions at once: far too much for the normal case, and still too little for
            # the worst case it claimed to cover.
            #
            # Declared rather than left to Kyverno's add-default-resources mutation, which
            # would inject 32Mi and OOM on the first real log.
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - mountPath: /scripts
              name: script
              readOnly: true
            - mountPath: /tmp
              name: temp
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 11111
            runAsGroup: 11111
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: script
            configMap:
              name: ci-diagnostics-script
          - name: temp
            # Disk-backed on purpose -- `medium: Memory` would make this tmpfs, whose pages
            # are unreclaimable and charged like anonymous memory, undoing the whole reason
            # job logs are spooled here rather than held in the heap.
            #
            # sizeLimit is declared because this now holds real files. Only one job log
            # exists at a time and the largest on record is ~20 MiB; 128Mi leaves room for
            # an outlier without letting a runaway download fill the node.
            emptyDir:
              sizeLimit: 128Mi
      ttlSecondsAfterFinished: 604800  # 1 week
  # Hourly, and cheap because of it. A pass over a fleet with nothing new costs seventeen
  # Loki queries plus seventeen run listings -- runs already ingested are skipped before
  # any per-run API call, by comparing attempt counts (see known_attempts).
  #
  # Frequency is not about freshness; the fleet only samples four times a day. It is about
  # keeping each pass small, so that being cut off by activeDeadlineSeconds costs an hour
  # of catch-up rather than a day.
  schedule: "40 * * * *"
  startingDeadlineSeconds: 43200  # 12 hours
  successfulJobsHistoryLimit: 8
  timeZone: Etc/UTC
