---
# A GitHub token is not a rate-limit nicety here, it is mandatory. Measured 2026-08-17
# against the public repo: an unauthenticated caller gets 200 on /actions/runs and
# /actions/runs/{id}/jobs, but 403 on /actions/jobs/{id}/logs -- with 50 requests still
# remaining, so it is an authorization wall and not a quota. The instrument lines are in
# those logs, so no token means no data.
#
# Scope needed: Actions **read** plus Metadata read, on this one repository. Nothing here
# writes. Deliberately not the existing `github_pat_mcp` entry, which is organisation-wide
# and carries issue/PR/gist **write** -- reusing it would widen a read-only job's blast
# radius to every repository for the sake of skipping one vault entry.
#
# The vault entry must be created by hand before this merges; see README.md in this
# directory. That is settled practice here, not a gap: Terraform's GitHub provider has no
# PAT resource, so every GitHub credential in this estate is hand-minted and hand-stored
# (clusters#779). A hand-created Bitwarden entry is not managed by Terraform and so is not
# reverted by an apply.
#
# Store name is hardcoded rather than `${secret_store}`: that variable is defined by the
# module Kustomizations, and config-services -- which builds this directory -- does not
# define it. A `${secret_store}` here would be substituted to an empty string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-diagnostics-secrets
  namespace: ci-diagnostics
spec:
  data:
  - secretKey: GITHUB_TOKEN
    remoteRef:
      key: ci_diagnostics_github_token
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
