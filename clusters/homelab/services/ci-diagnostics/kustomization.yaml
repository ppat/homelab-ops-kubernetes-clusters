---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- externalsecret-ci-diagnostics.yaml
- cronjob-ci-diagnostics.yaml

configMapGenerator:
- name: ci-diagnostics-script
  namespace: logging
  files:
  - ci-diagnostics.py
  options:
    annotations:
      # Prophylactic rather than presently load-bearing, and worth keeping for that.
      # config-services runs Flux post-build substitution over everything it builds, and
      # envsubst expands bare `$name` as well as `${name}`. The `$` characters in this script
      # today are all regex end-anchors followed by a quote, which envsubst leaves alone -- so
      # strictly, nothing breaks without this line right now. What it buys is that a future
      # edit adding `${...}` in an f-string or a `$word` in a character class cannot silently
      # blank itself, and the failure mode it prevents is a script that still parses and
      # quietly does the wrong thing. (On the *dashboard* ConfigMap next door the identical
      # annotation genuinely is mandatory: `$datasource`, `$suite` and `$search` would all be
      # substituted away.)
      kustomize.toolkit.fluxcd.io/substitute: disabled
    # Deliberately different from loki-query-correctness next door, which lets the name
    # hash so a script edit rolls a new ConfigMap. That is the right call for a workload
    # whose pods are long-lived; it is the wrong one here. A CronJob's pods are created
    # fresh at each schedule and the kubelet projects the ConfigMap's current content at
    # that moment, so a stable name already picks up an edit on the next run. Meanwhile
    # Flux prune is disabled cluster-wide, so a hashed name would strand an orphaned
    # ConfigMap on every single edit to the script.
    disableNameSuffixHash: true
