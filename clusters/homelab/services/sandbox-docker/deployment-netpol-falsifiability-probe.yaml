---
# A NetworkPolicy that has never been tested in the failing direction proves nothing --
# it could select zero pods (label typo), or the CNI's policy controller could have
# stopped enforcing (upgrade, restart, config drift) while the object itself still reads
# as correct. This Deployment is that test: it runs from inside the namespace the policy
# in network-policy.yaml protects, using the exact same pod network the protected workload
# will use, and asserts every denial *and* the two paths that must stay open, on a
# recurring loop. A probe that only checked denials would pass against a totally broken
# network (e.g. no policy enforcement at all) just as easily as against a correctly
# locked-down one.
#
# Why a Deployment and not a CronJob/Job (this used to be a CronJob -- see git history):
# k3s's bundled kube-router-derived NetworkPolicy controller programs each pod's firewall
# chain (KUBE-POD-FW-*) and its dispatch rule in KUBE-ROUTER-FORWARD *reactively*, after the
# pod exists -- a pod with no dispatch rule yet falls straight through to `-P FORWARD
# ACCEPT`, fully unpoliced. A short-lived Job pod can complete before that rule is ever
# programmed, and this CronJob did exactly that on its first real run: every single denial
# target reported reachable, because the *probe pod itself* was never policed, not because
# the NetworkPolicy was broken. A long-lived pod sidesteps that race entirely instead of
# re-running it every schedule tick: it's programmed once (verified by the warm-up gate
# below, which still runs first and still fails loudly if it times out) and stays
# programmed for the rest of its life, same as the sandbox's real VM workload -- so the
# probe no longer needs to win the same race every 15 minutes just to be trustworthy.
# The pod-creation race itself doesn't go away -- it's a real property of a *freshly
# created* pod in this namespace, and it's still exercised here, just less often: every
# container (re)start (a rollout, a node drain, an eviction, a crash) re-runs the warm-up
# gate against a brand-new pod. See network-policy.yaml and OPERATIONS.md for why this
# matters beyond this probe: any short-lived pod in this namespace faces the identical
# window, and it's documented there as a standing caveat of the isolation model, not
# something this probe alone can close.
#
# What this costs: no more discrete `kube_job_failed` per-run signal, since there's no Job
# object. What it doesn't cost: the individual PASS/FAIL-style verdict lines were always
# going to Loki via Alloy regardless of the Job/Deployment split (confirmed against the
# live `loki` datasource: `{namespace="sandbox-docker"}` already returned this probe's
# lines with `pod`/`node_name`/`container` labels) -- that per-target detail is strictly
# richer than a binary job-failed flag. The `SUMMARY` line each cycle emits below exists so
# "the probe silently died" and "the probe is cleanly passing" stay distinguishable in
# Loki (an absent recent SUMMARY line is itself the signal a dead probe would otherwise
# fake by producing no FAIL lines at all) -- see OPERATIONS.md for the LogQL to query both.
#
# AlertManager is deliberately not wired up yet (no triage layer exists for a one-person
# homelab), so this leans on being queryable in Loki/Grafana rather than paging -- see
# OPERATIONS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-falsifiability-probe
  namespace: sandbox-docker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netpol-falsifiability-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netpol-falsifiability-probe
    spec:
      # No selector needed to be caught by the sandbox's default-deny/allow policies: they
      # use podSelector: {}, which matches every pod in the namespace, including this one --
      # that's what makes this pod a faithful stand-in for the VM's own virt-launcher pod
      # rather than a special-cased exception to it.
      automountServiceAccountToken: false
      containers:
      - name: probe
        # Digest-only pin, no floating tag -- matches the busybox reference already in use
        # (and Renovate-tracked) elsewhere in this repo, e.g. traefik's log-rotate
        # init-container.
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        env:
        - name: NAMESPACE
          value: "sandbox-docker"
        - name: NODE_IPS
          value: "192.168.8.65 192.168.8.67 192.168.8.68 192.168.8.69"
        - name: IN_CLUSTER_KUBERNETES_SERVICE
          # The well-known first usable address in the service CIDR (10.43.0.0/16,
          # inferred from observed ClusterIPs -- there is no in-cluster way to read the
          # CIDR itself at runtime).
          value: "10.43.0.1"
        - name: UNIFI_GATEWAY
          value: "192.168.8.1"
        - name: LB_INGRESS_VIP_HOMELAB
          # DENY target, not an allow -- despite being the same kind of object as
          # LB_INGRESS_VIP_NAS below. This is *this cluster's own* MetalLB `standard-pool`
          # VIP (Traefik's), so a pod's packet to it gets DNAT'd by k3s's embedded
          # kube-proxy to a Traefik pod IP (10.42.x.x) before kube-router's NetworkPolicy
          # controller ever evaluates it -- NetworkPolicy sees the post-DNAT destination,
          # inside the 10.0.0.0/8 `except`, not the VIP this dials. allow-egress-lb-ingress-
          # vips in network-policy.yaml deliberately does NOT include this range as a
          # result (it would be dead config -- it can never match); this probe asserting
          # BLOCKED is expected and correct, not a gap. See that NetworkPolicy for the full
          # mechanism -- this is the same DNAT effect the in-cluster kubernetes Service
          # check below already exercises.
          value: "192.168.8.80"
        - name: LB_INGRESS_VIP_NAS
          # Positive control for allow-egress-lb-ingress-vips in network-policy.yaml: nas's
          # MetalLB `standard-pool` VIP -- also Harbor's VIP, since Harbor is
          # ingress-fronted rather than a dedicated LoadBalancer Service. Unlike
          # LB_INGRESS_VIP_HOMELAB above, this has no Service on *this* cluster, so no DNAT
          # intercepts it and the ipBlock allow actually applies. Must stay in lockstep with
          # that NetworkPolicy's ipBlock.
          value: "192.168.8.192"
        - name: TIMEOUT_SECONDS
          value: "3"
        - name: WARMUP_TIMEOUT_SECONDS
          # Bound on how long this pod waits for its own dispatch rule to be programmed
          # before refusing to run the suite at all. Chosen generously relative to k3s's
          # kube-router sync loop (observed on the order of single-digit seconds in this
          # cluster, though the exact figure wasn't independently re-derived from source
          # for this change -- treat 30s as "many sync cycles of headroom", not a measured
          # constant) while still being short enough that a genuinely broken node (CNI
          # crash-looping, the pod stuck Pending) fails this container out loud within
          # half a minute instead of hanging silently.
          value: "30"
        - name: WARMUP_POLL_INTERVAL_SECONDS
          value: "2"
        - name: PROBE_INTERVAL_SECONDS
          # How long to sleep between suite cycles once warmed up. Tighter than the old
          # CronJob's 15-minute schedule -- a long-lived pod doesn't pay per-run pod
          # creation/scheduling cost, so a shorter interval is nearly free -- while still
          # polite to the prod targets being probed (kube-apiserver, etcd): one denied
          # connection attempt per target per cycle, not a tight port-scan loop.
          value: "300"
        - name: HEARTBEAT_FILE
          # Written once warm-up succeeds and again after every full cycle -- see the
          # livenessProbe below for what reads it. Must be writable; the container's root
          # filesystem is read-only, so this lives on the `heartbeat` emptyDir volume, not
          # the image itself.
          value: "/var/run/probe/heartbeat"
        - name: HEARTBEAT_MAX_AGE_SECONDS
          # How stale HEARTBEAT_FILE can get before the liveness probe below decides the
          # loop is wedged. PROBE_INTERVAL_SECONDS (one full cycle between writes) plus
          # headroom for a cycle's own bounded probe time (worst case, every deny target
          # times out instead of refusing instantly: ~17 checks x TIMEOUT_SECONDS(3s) =
          # ~51s) plus a safety margin, rounded up. Not derived from PROBE_INTERVAL_SECONDS
          # automatically -- an exec probe command can't reach into another env var's
          # arithmetic cleanly -- so keep this above PROBE_INTERVAL_SECONDS + ~120s if that
          # value changes.
          value: "420"
        - name: MIDLIFE_REVERIFY_EVERY_N_CYCLES
          # How often (in cycles, not seconds) to re-run the warm-up gate's own
          # enforcement check instead of only trusting the one done at container start.
          # At the default PROBE_INTERVAL_SECONDS=300s, 12 cycles is ~1 hour: tight enough
          # to bound how long an undetected mid-life enforcement lapse (a kube-router
          # restart racing this pod, a full iptables resync gone wrong) could persist
          # unnoticed in a homelab with no alerting, and deliberately slower than the
          # ordinary per-cycle "UniFi gateway" deny probe already below -- see the
          # MIDLIFE-* block in the loop for why this is a separate, rarer check rather
          # than reusing that one.
          value: "12"
        command:
        - /bin/sh
        # `sh <path>`, not an exec of the mounted file: the ConfigMap mount's mode is then
        # irrelevant to whether this runs, and the interpreter stays spelled out exactly as
        # it was when this was an inline `sh -c` argument (busybox ash, this image's
        # /bin/sh). scripts/ is mounted whole, never via subPath -- a subPath mount is
        # snapshotted at pod start and would stop tracking the ConfigMap whose hash suffix
        # rolls this Deployment when either script changes.
        - /etc/scripts/falsifiability-check.sh
        livenessProbe:
          # Catches exactly one failure mode: the probe loop hung mid-cycle on something
          # with no timeout of its own -- concretely, the plain `nslookup api.github.com`
          # call above has no explicit bound and can wedge forever against a
          # broken/unreachable DNS server (the other named failure mode, a hung `nc`,
          # can't happen: every `nc` call in this script is already `-w`-bounded). It does
          # NOT check whether the probe suite's findings are correct -- that's what
          # SUMMARY/violations in this container's own logs are for -- only whether the
          # loop producing them is still moving. `exec: ["true"]` would satisfy Kyverno's
          # require-probes policy too, and would detect nothing; this is deliberately
          # not that.
          #
          # A restart here is desirable, not just tolerated: it re-runs the warm-up gate
          # on the new pod, re-proving enforcement before the loop resumes -- same
          # reasoning as MIDLIFE_REVERIFY_EVERY_N_CYCLES choosing restart over
          # log-and-continue above.
          #
          # This exec probe's own stdout goes to kubelet's probe result, not this
          # container's log stream -- a failure here shows up via `kubectl describe pod`
          # (`Warning  Unhealthy`) and the same `kube_pod_container_status_restarts_total`
          # climb already used as a proxy for WARMUP-TIMEOUT restarts (see OPERATIONS.md),
          # not by grepping Loki for a token.
          exec:
            command:
            - /bin/sh
            # Same scripts/ ConfigMap the main loop is mounted from. The file's
            # last statement is the `[ ... ]` test, so the probe's verdict is
            # still that test's exit status, exactly as when it was inline.
            - /etc/scripts/liveness-heartbeat-age.sh
          # Covers the warm-up gate's own worst case (WARMUP_TIMEOUT_SECONDS=30s) plus
          # slack to reach the first heartbeat write, which happens the moment warm-up
          # succeeds -- not only after the first full cycle -- so this doesn't also need
          # to cover a full PROBE_INTERVAL_SECONDS.
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # No readinessProbe: this pod fronts no Service and receives no traffic, so there
        # is nothing for "ready to receive traffic" to mean here. Adding one anyway would
        # only be to placate Kyverno's require-probes policy, which livenessProbe
        # above already satisfies -- the same always-passing-probe trap this fix exists to
        # avoid. No startupProbe either: the warm-up gate already self-bounds startup and
        # exits non-zero on its own timeout, and initialDelaySeconds above already covers
        # that window for the liveness probe.
        volumeMounts:
        - name: scripts
          mountPath: /etc/scripts
          readOnly: true
        - name: heartbeat
          mountPath: /var/run/probe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      # Generated by ../kustomization.yaml's configMapGenerator from scripts/, holding both
      # falsifiability-check.sh (this container's own command, the assertion loop) and
      # liveness-heartbeat-age.sh (the kubelet liveness probe above). One ConfigMap for the
      # pair because one workload consumes both: a change to either should roll this
      # Deployment, which is exactly what the hash suffix -- deliberately left on -- does.
      - name: scripts
        configMap:
          name: netpol-falsifiability-probe-scripts
          # Executable for symmetry with the files' mode in git; both invocations above
          # are `sh <path>`, so nothing depends on this.
          defaultMode: 0o555
      - name: heartbeat
        # Backs HEARTBEAT_FILE -- readOnlyRootFilesystem: true above means the image
        # itself isn't writable, so the liveness heartbeat needs its own writable spot.
        emptyDir:
          sizeLimit: 1Mi
