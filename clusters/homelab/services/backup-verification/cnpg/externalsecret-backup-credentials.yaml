---
# The same Bitwarden entries, and the same rendered keys, as the production credentials
# that components/db-backups creates in each source namespace. A barman-cloud ObjectStore
# can only reference a Secret in its own namespace, so the recovery side needs its own copy.
# Moving a database to another store means changing the remoteRef keys here together with
# objectstore-backup-stores.yaml. The verification run fails until both move, because it
# compares the store location with production's on every run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-backup-credentials
  namespace: backup-verification
spec:
  data:
  - secretKey: access_key_id
    remoteRef:
      key: cluster_nas_minio_cloudnativepg_accesskeyid
  - secretKey: secret_key
    remoteRef:
      key: cluster_nas_minio_cloudnativepg_secretkey
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      metadata:
        annotations: {}
        labels:
          cnpg.io/reload: "1"
      data:
        s3_accesskeyid: "{{ .access_key_id }}"
        s3_secretaccesskey: "{{ .secret_key }}"
        s3_region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
