  namespace: backup-verification
spec:
  data:
  - secretKey: access_key_id
    remoteRef:
      key: versitygw_cloudnativepg_accesskey
  - secretKey: secret_key
    remoteRef:
      key: versitygw_cloudnativepg_secretkey
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
  target:
    template:
      type: Opaque
      metadata:
        annotations: {}
        labels:
          cnpg.io/reload: "1"
      data:
        s3_accesskeyid: "{{ .access_key_id }}"
        s3_secretaccesskey: "{{ .secret_key }}"
        s3_region: us-east-1
