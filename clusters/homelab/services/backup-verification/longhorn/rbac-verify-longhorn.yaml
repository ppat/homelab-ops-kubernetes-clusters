---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verify-longhorn
  namespace: backup-verification
---
# Read backups, and create and delete only the verification volumes. `create` cannot be
# limited by name in RBAC; every other verb on volumes is.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verify-longhorn
  namespace: longhorn-system
rules:
- apiGroups: [longhorn.io]
  resources: [backupvolumes, backups]
  verbs: [get, list]
- apiGroups: [longhorn.io]
  resources: [volumes]
  verbs: [create]
- apiGroups: [longhorn.io]
  resources: [volumes]
  resourceNames: [bv-prowlarr, bv-lidarr]
  verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verify-longhorn
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verify-longhorn
subjects:
- kind: ServiceAccount
  name: verify-longhorn
  namespace: backup-verification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: verify-longhorn
rules:
- apiGroups: [""]
  resources: [persistentvolumes]
  verbs: [create]
- apiGroups: [""]
  resources: [persistentvolumes]
  resourceNames: [bv-prowlarr, bv-lidarr]
  verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: verify-longhorn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: verify-longhorn
subjects:
- kind: ServiceAccount
  name: verify-longhorn
  namespace: backup-verification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verify-longhorn-checks
  namespace: backup-verification
rules:
- apiGroups: [""]
  resources: [persistentvolumeclaims, pods]
  verbs: [get, list, watch, create, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: verify-longhorn-checks
  namespace: backup-verification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: verify-longhorn-checks
subjects:
- kind: ServiceAccount
  name: verify-longhorn
  namespace: backup-verification
