---
# See sandbox-docker/deployment-netpol-falsifiability-probe.yaml for the full rationale --
# same design, same reasoning about why a policy that's never been tested in the failing
# direction proves nothing, why this runs as a long-lived Deployment rather than a
# CronJob/Job (the pod-creation race that produced a false "everything reachable" result on
# this probe's first real run), and why the warm-up gate below still has to establish
# enforcement for THIS pod before trusting anything, every time this container (re)starts.
# Queryable via Loki (`{namespace="sandbox-talos"}`); no AlertManager wiring by design (see
# OPERATIONS.md).
#
# One probe here has no sandbox-docker equivalent: reachability of the Docker namespace's
# SSH Service from this namespace, which is the one that must NEVER pass -- see
# network-policy.yaml for why. That Service now exists -- `docker-vm` in sandbox-docker,
# the exact name DOCKER_SSH_SERVICE below was written to anticipate -- so this check
# resolves and asserts on every cycle rather than skipping. The SKIP-on-unresolvable
# branch below stays anyway: it has to hold whenever that Service is absent (a
# destroy-and-rebuild window, or a cluster where the dockerd VM was never built), because
# an unresolvable name isn't evidence the policy works, it's evidence there's nothing
# there. Update the env var if that Service is ever renamed.
#
# A second probe here also has no sandbox-docker equivalent, and for a sharper reason than
# "no such need there": same-namespace reachability of this VM's own Service, on both
# ports it serves. This is a positive control (must stay reachable, like the
# api.github.com/DNS checks below), added because the deny-only suite above would not have
# caught the exact bug it exists to catch -- allow-same-namespace-ingress-to-vm in
# network-policy.yaml admits this traffic today, but nothing before that fix ever asserted
# it was reachable, so the policy silently regressing to "same-namespace ingress denied
# again" would pass every deny probe here without comment. See network-policy.yaml for the
# full incident (bootstrap-job.yaml's `talosctl bootstrap` call denied with `connection
# refused`) and the general lesson (an egress allow doesn't imply the matching ingress
# allow; same-namespace traffic is never exempt once an ingress policy selects the pod).
#
# Same "not deployed yet" problem as DOCKER_SSH_SERVICE above, handled the same way: the
# VM and its Service are provisioned from a separate repo/process
# (homelab-ops-kubernetes-experiments), not by this Flux module, so this probe has to make
# sense running before that's ever applied to a given cluster, or after `talosctl reset`
# wipes the VM's own state and before it's re-bootstrapped. TALOS_VM_SERVICE unresolvable
# is SKIP, not a violation, for the same reason as DOCKER_SSH_SERVICE. Once it resolves,
# though, this check is meaningful only once the VM is actually up and listening -- and
# because this stack REJECTs a denied packet instead of dropping it (see network-policy.yaml
# CAVEAT), a genuine policy regression is indistinguishable at the TCP level from the VM
# still booting. That ambiguity is inherent to any positive-reachability probe against a
# real workload, not something to paper over: this deliberately fails loud
# (REACHABLE/BLOCKED (violation), never a silent pass) on either cause once the Service
# exists, rather than guessing which one it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-falsifiability-probe
  namespace: sandbox-talos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netpol-falsifiability-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netpol-falsifiability-probe
    spec:
      automountServiceAccountToken: false
      containers:
      - name: probe
        image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        env:
        - name: NAMESPACE
          value: "sandbox-talos"
        - name: NODE_IPS
          value: "192.168.8.65 192.168.8.67 192.168.8.68 192.168.8.69"
        - name: IN_CLUSTER_KUBERNETES_SERVICE
          value: "10.43.0.1"
        - name: UNIFI_GATEWAY
          value: "192.168.8.1"
        - name: LB_INGRESS_VIP_HOMELAB
          # DENY target, not an allow -- see sandbox-docker's copy of this Deployment and
          # network-policy.yaml for the full DNAT-vs-NetworkPolicy mechanism: this is
          # *this cluster's own* MetalLB VIP, so pod-originated traffic to it gets DNAT'd
          # to a Traefik pod IP (inside the 10.0.0.0/8 `except`) before NetworkPolicy ever
          # evaluates it, and the corresponding ipBlock allow deliberately excludes this
          # range as a result.
          value: "192.168.8.80"
        - name: LB_INGRESS_VIP_NAS
          # Positive control -- also Harbor's VIP. See sandbox-docker's copy and
          # network-policy.yaml: nas has no Service on this cluster, so no DNAT intercepts
          # it and the ipBlock allow actually applies.
          value: "192.168.8.192"
        - name: DOCKER_SSH_SERVICE
          # Name/port of the Service fronting dockerd's SSH in the sandbox-docker namespace.
          # Live today -- see the file-level comment above for what happens when it isn't.
          value: "docker-vm.sandbox-docker.svc.cluster.local"
        - name: DOCKER_SSH_PORT
          value: "22"
        - name: TALOS_VM_SERVICE
          # Same DNS name bootstrap-job.yaml/provision-agent-admin-cronjob.yaml target
          # (ENDPOINT there) -- see the file-level comment above for why this is a
          # positive control, not a deny target.
          value: "talos-vm.sandbox-talos.svc.cluster.local"
        - name: TALOS_VM_TALOS_PORT
          value: "50000"
        - name: TALOS_VM_K8S_PORT
          value: "6443"
        - name: TIMEOUT_SECONDS
          value: "3"
        - name: WARMUP_TIMEOUT_SECONDS
          value: "30"
        - name: WARMUP_POLL_INTERVAL_SECONDS
          value: "2"
        - name: PROBE_INTERVAL_SECONDS
          value: "300"
        - name: HEARTBEAT_FILE
          # See sandbox-docker's copy of this Deployment for the full rationale (Fix 2:
          # liveness heartbeat). Backed by the `heartbeat` emptyDir volume below, since the
          # root filesystem is read-only.
          value: "/var/run/probe/heartbeat"
        - name: HEARTBEAT_MAX_AGE_SECONDS
          # See sandbox-docker's copy for the derivation (PROBE_INTERVAL_SECONDS plus
          # headroom for a cycle's own bounded probe time plus a safety margin). This
          # namespace probes one extra target per cycle (the cross-sandbox SSH check
          # below), which is still well within the same ~120s of headroom.
          value: "420"
        - name: MIDLIFE_REVERIFY_EVERY_N_CYCLES
          # See sandbox-docker's copy for the derivation (Fix 3: ~1 hour at the default
          # PROBE_INTERVAL_SECONDS).
          value: "12"
        command:
        - /bin/sh
        - -c
        # yamllint disable rule:line-length
        # yamllint disable-line rule:indentation
        - |
          set -u

          # --- Warm-up: establish enforcement before trusting anything below ---
          # See sandbox-docker's copy of this Deployment for the full rationale.
          echo "WARMUP: waiting for this pod's egress chain to be programmed (deny-probing ${UNIFI_GATEWAY}:443)..."
          warmup_elapsed=0
          warmup_ok=0
          while [ "$warmup_elapsed" -lt "$WARMUP_TIMEOUT_SECONDS" ]; do
            if ! nc -z -w 1 "$UNIFI_GATEWAY" 443 2>/dev/null; then
              echo "WARMUP-OK: denial observed after ${warmup_elapsed}s -- this pod is now policed, starting probe loop"
              warmup_ok=1
              break
            fi
            sleep "$WARMUP_POLL_INTERVAL_SECONDS"
            warmup_elapsed=$((warmup_elapsed + WARMUP_POLL_INTERVAL_SECONDS))
          done

          if [ "$warmup_ok" -ne 1 ]; then
            echo "WARMUP-TIMEOUT: ${UNIFI_GATEWAY}:443 was still reachable after ${WARMUP_TIMEOUT_SECONDS}s -- this pod's egress was never policed within the warm-up window. This is NOT evidence the NetworkPolicy is broken: it means enforcement could not be established for THIS pod before the deadline, so nothing below can be trusted yet. See the kube-router per-pod dispatch-rule race documented in network-policy.yaml / OPERATIONS.md. Exiting non-zero so this is loud (pod restart, CrashLoopBackOff) rather than a silent false pass."
            exit 1
          fi

          # --- Heartbeat: evidence for the liveness probe that the loop is still alive ---
          # See sandbox-docker's copy of this Deployment for the full rationale (Fix 2).
          date +%s > "$HEARTBEAT_FILE"

          # --- Main probe suite: runs on a loop once warm-up has succeeded ---
          probe_deny() {
            desc="$1"; host="$2"; port="$3"
            probes=$((probes + 1))
            if nc -z -w "$TIMEOUT_SECONDS" "$host" "$port" 2>/dev/null; then
              echo "REACHABLE (violation): $desc ($host:$port)"
              violations=$((violations + 1))
            else
              echo "BLOCKED (ok): $desc ($host:$port)"
            fi
          }

          probe_allow() {
            desc="$1"; host="$2"; port="$3"
            probes=$((probes + 1))
            if nc -z -w "$TIMEOUT_SECONDS" "$host" "$port" 2>/dev/null; then
              echo "REACHABLE (ok): $desc ($host:$port)"
            else
              echo "BLOCKED (violation): $desc ($host:$port)"
              violations=$((violations + 1))
            fi
          }

          cycle=0
          while true; do
            cycle=$((cycle + 1))
            probes=0
            violations=0

            # --- Mid-life re-verification (Fix 3) ---
            # See sandbox-docker's copy of this Deployment for the full rationale: why this
            # is a separate, rarer check rather than reusing the ordinary per-cycle "UniFi
            # gateway" deny probe below, and why a lapse restarts the pod instead of
            # logging and continuing.
            if [ $((cycle % MIDLIFE_REVERIFY_EVERY_N_CYCLES)) -eq 0 ]; then
              if nc -z -w "$TIMEOUT_SECONDS" "$UNIFI_GATEWAY" 443 2>/dev/null; then
                echo "MIDLIFE-ENFORCEMENT-LAPSE: ${UNIFI_GATEWAY}:443 reachable at cycle ${cycle} -- this pod was policed at start (WARMUP-OK) but is not policed now. Exiting non-zero to force a restart and re-prove enforcement from a clean pod."
                exit 1
              fi
              echo "MIDLIFE-CHECK-OK: enforcement re-confirmed at cycle ${cycle} (next re-check in ${MIDLIFE_REVERIFY_EVERY_N_CYCLES} cycles)"
            fi

            for node in $NODE_IPS; do
              probe_deny "prod kube-apiserver" "$node" 6443
              # Longhorn manager (:9500) dropped -- see sandbox-docker's copy of this
              # Deployment for why: its Service is ClusterIP-only, so node-IP:9500 is a
              # dead port regardless of policy and always reported a false "denied as
              # expected". kubelet below already covers "does the deny mechanism work
              # against every node IP".
              probe_deny "kubelet" "$node" 10250
              probe_deny "etcd" "$node" 2379
            done

            probe_deny "UniFi gateway" "$UNIFI_GATEWAY" 443
            probe_deny "in-cluster kubernetes Service" "$IN_CLUSTER_KUBERNETES_SERVICE" 443

            # Cross-sandbox denial: the load-bearing check for why these are two
            # namespaces rather than one. See network-policy.yaml.
            probes=$((probes + 1))
            if nslookup "$DOCKER_SSH_SERVICE" >/dev/null 2>&1; then
              if nc -z -w "$TIMEOUT_SECONDS" "$DOCKER_SSH_SERVICE" "$DOCKER_SSH_PORT" 2>/dev/null; then
                echo "REACHABLE (violation): Docker namespace SSH Service ($DOCKER_SSH_SERVICE:$DOCKER_SSH_PORT)"
                violations=$((violations + 1))
              else
                echo "BLOCKED (ok): Docker namespace SSH Service ($DOCKER_SSH_SERVICE:$DOCKER_SSH_PORT)"
              fi
            else
              echo "SKIP: Docker namespace SSH Service ($DOCKER_SSH_SERVICE:$DOCKER_SSH_PORT) -- not deployed yet"
            fi

            # Same-namespace positive control: the Talos VM's own Service, both ports it
            # serves. See the file-level comment above for why this exists and why it's
            # SKIP (not a violation) when the Service doesn't resolve yet. Two ports, so
            # (unlike the single-target DOCKER_SSH_SERVICE check above) the SKIP branch
            # bumps `probes` by 2 itself rather than sharing one outer increment --
            # probe_allow already does its own increment for each port on the resolvable
            # path, so this keeps the SKIP and checked paths counting the same total either
            # way.
            if nslookup "$TALOS_VM_SERVICE" >/dev/null 2>&1; then
              probe_allow "Talos VM Talos API (same-namespace ingress)" "$TALOS_VM_SERVICE" "$TALOS_VM_TALOS_PORT"
              probe_allow "Talos VM Kubernetes API (same-namespace ingress)" "$TALOS_VM_SERVICE" "$TALOS_VM_K8S_PORT"
            else
              probes=$((probes + 2))
              echo "SKIP: Talos VM Service ($TALOS_VM_SERVICE) -- not deployed yet (both ports)"
            fi

            # LB_INGRESS_VIP_HOMELAB is a deny-assertion (DNAT to a Traefik pod IP before
            # NetworkPolicy evaluates it), LB_INGRESS_VIP_NAS is the positive control -- see
            # sandbox-docker's copy of this Deployment for the full rationale (REJECT vs
            # DROP, why proof-of-liveness for the homelab target comes from outside this
            # probe, and why the NAS check only proves L3 reachability, not which hostname
            # is behind the VIP).
            probe_deny "homelab standard-pool ingress VIP (DNAT to pod IP, expected denied)" "$LB_INGRESS_VIP_HOMELAB" 443
            probe_allow "nas standard-pool ingress VIP (LoadBalancer allow, fronts Harbor)" "$LB_INGRESS_VIP_NAS" 443

            probe_allow "GitHub API (internet egress)" "api.github.com" 443

            probes=$((probes + 1))
            if nslookup api.github.com >/dev/null 2>&1; then
              echo "REACHABLE (ok): DNS resolution via CoreDNS"
            else
              echo "BLOCKED (violation): DNS resolution via CoreDNS"
              violations=$((violations + 1))
            fi

            if [ "$violations" -eq 0 ]; then
              echo "SUMMARY namespace=$NAMESPACE cycle=$cycle probes=$probes violations=$violations verdict=CLEAN"
            else
              echo "SUMMARY namespace=$NAMESPACE cycle=$cycle probes=$probes violations=$violations verdict=VIOLATIONS-DETECTED"
            fi

            date +%s > "$HEARTBEAT_FILE"
            sleep "$PROBE_INTERVAL_SECONDS"
          done
        # yamllint enable rule:line-length
        livenessProbe:
          # See sandbox-docker's copy of this Deployment for the full rationale (Fix 2):
          # catches the probe loop hanging mid-cycle on something with no timeout of its
          # own (the plain `nslookup api.github.com` call above, or -- unique to this
          # namespace -- a DNS lookup on DOCKER_SSH_SERVICE during a window where that
          # Service is absent, though `nslookup` failing fast on NXDOMAIN is the expected
          # case there, not a hang). Every `nc` call is `-w`-bounded, so a hung `nc`
          # can't happen here either. `exec: ["true"]` would satisfy Kyverno's
          # require-pod-probes policy too, and would detect nothing; this is deliberately
          # not that.
          #
          # This exec probe's own stdout goes to kubelet's probe result, not this
          # container's log stream -- see sandbox-docker's copy for how a failure here is
          # actually surfaced.
          exec:
            command:
            - /bin/sh
            - -c
            - |
                now=$(date +%s)
                hb=$(stat -c %Y "$HEARTBEAT_FILE" 2>/dev/null) || exit 1
                [ $((now - hb)) -le "$HEARTBEAT_MAX_AGE_SECONDS" ]
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # No readinessProbe/startupProbe -- see sandbox-docker's copy of this Deployment
        # for why (no traffic to gate readiness on; the warm-up gate already self-bounds
        # startup).
        volumeMounts:
        - name: heartbeat
          mountPath: /var/run/probe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: heartbeat
        # Backs HEARTBEAT_FILE -- readOnlyRootFilesystem: true above means the image
        # itself isn't writable, so the liveness heartbeat needs its own writable spot.
        emptyDir:
          sizeLimit: 1Mi
