---
# Falsifiable LogQL correctness check for the object-store trial
# (homelab-ops-kubernetes-apps#3611). See loki-query-correctness.py for what
# this actually proves and why. Talks only to Loki's own query API - never to
# the object store - so it is backend-agnostic and keeps re-verifying the
# same baseline across the MinIO->Garage cutover without any change here.
#
# Cluster-specific, not a module: retiring this once cutover is proven is
# deleting this directory, not a module release with a breaking change - see
# clusters/homelab/README.md#cluster-specific-services.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loki-query-correctness
  namespace: logging
  labels:
    app.kubernetes.io/name: loki-query-correctness
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 8
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: loki-query-correctness
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loki-query-correctness
        spec:
          serviceAccountName: loki-query-correctness
          automountServiceAccountToken: true
          containers:
          - name: loki-query-correctness
            image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
            command: ["python3", "/scripts/loki-query-correctness.py"]
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The compactor's global retention_period - not itself present
            # in the retention-config volume below, which only carries the
            # retention_stream overrides (see loki-query-correctness.py's
            # GLOBAL_RETENTION comment for why this is a manually-maintained
            # duplicate of kustomizations/infra-observability-core.yaml's
            # loki_retention_size, sourced here via
            # kustomizations/config-services.yaml's global_loki_retention).
            - name: GLOBAL_RETENTION
              value: "${global_loki_retention}"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /scripts
              name: script
              readOnly: true
            - mountPath: /tmp
              name: temp
            # loki-retention.yaml, the retention_stream selectors that
            # actually govern what Loki deletes and when - the same
            # ConfigMap logging/kustomization.yaml generates and Loki's own
            # HelmRelease reads via valuesFrom. Mounted read-only, no RBAC
            # widening needed: volume mounts are resolved by the kubelet
            # against the pod's namespace, not the pod's own ServiceAccount
            # token (see rbac-loki-query-correctness.yaml, which stays
            # scoped to just the baseline ConfigMap).
            - mountPath: /etc/loki-retention
              name: retention-config
              readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 11111
            runAsGroup: 11111
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: script
            configMap:
              name: loki-query-correctness-script
          - name: temp
            emptyDir: {}
          - name: retention-config
            configMap:
              name: loki-extra-config
      ttlSecondsAfterFinished: 604800  # 1 week
  # Hourly, not daily: the only signal this check has is
  # kube_cronjob_status_last_successful_time (see prometheusrule in this same
  # directory), and this estate leaves AlertManager unwired deliberately -
  # nothing pages on it, someone has to look. At a daily cadence "stale"
  # means nothing until 24h+ has passed; hourly makes that metric mean
  # something within a couple of hours instead.
  #
  # This cadence must not change between the KPI baseline period and the
  # Garage trial: the check's own query_range calls are load against the
  # object store under benchmark, so its cadence is part of the measured
  # profile. Identical cadence on both backends cancels out of the
  # comparison; changing it partway biases the result. Once the trial
  # starts, leave this alone until it ends.
  #
  # A schedule is also the wrong tool for cutover verification - waiting up
  # to an hour for the answer at the moment it matters most isn't
  # acceptable, and this value should not be twisted to compensate. Trigger
  # a run on demand instead, immediately after the Garage cutover and after
  # each direction of the rollback drill:
  #   kubectl -n <namespace> create job --from=cronjob/loki-query-correctness qc-postcutover-1
  schedule: "0 * * * *"
  startingDeadlineSeconds: 43200  # 12 hours
  successfulJobsHistoryLimit: 8
  timeZone: Etc/UTC
