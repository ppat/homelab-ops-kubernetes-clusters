---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secret-manager-store
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://vault.bitwarden.com/api
      identityURL: https://vault.bitwarden.com/identity
      auth:
        secretRef:
          credentials:
            key: access-token
            name: bitwarden-machine-account
            namespace: external-secrets
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: ConfigMap
        name: bitwarden-ca-cert
        namespace: external-secrets
        key: ca.crt
      organizationID: f736b07c-b94f-42b0-a640-b204011e4200
      projectID: e9c6c45e-e8d9-480c-b2cf-b204011e80e6
  # This allowlist is the only access boundary on the whole store: projectID above is one
  # shared Bitwarden project, so every namespace listed here can read every secret in it,
  # not just the ones it consumes -- Bitwarden Secrets Manager's free tier caps project
  # count, so a second, sandbox-only project (the isolated option) isn't available.
  # sandbox-docker/sandbox-talos are here for their ExternalSecrets (an SSH public key;
  # the Talos machine config, which embeds the cluster CA private key) and accepted on
  # that shared-project basis because only Flux can create ExternalSecrets in either
  # namespace -- AI agents get cluster-admin on the Talos cluster running *inside* the
  # sandbox-talos VM, not on this host cluster, so they can't author one to read the rest
  # of the project. Re-open this if either changes: something other than Flux gains
  # ExternalSecret-create rights in a sandbox namespace, or a paid tier/second project
  # removes the reason a dedicated store isn't used instead.
  #
  # sandbox-lifecycle is here on a strictly stronger footing than either of those two, and
  # the difference is worth keeping straight: it is the namespace for workloads that operate
  # on the sandboxes from outside (../services/sandbox-lifecycle/, #842), and AI agents have
  # no rights in it at all -- not pod-create, not cluster-admin-in-a-VM, nothing. It needs
  # the store in both directions, which is also new here: an ExternalSecret pulling
  # sandbox_talos_vm_talosconfig down so provision-agent-admin can authenticate to the
  # sandbox VM's Talos API, and a PushSecret relaying the minted
  # sandbox_talos_vm_agent_admin_kubeconfig back up. The push direction is not a new
  # capability for the machine account -- apps/subsystems/{downloaders,home-automation} have
  # been pushing through this same store in production -- but it is the first time a sandbox
  # namespace does it, so it is called out rather than left to be inferred from the list.
  #
  # image-builder is here for its own ExternalSecret (a Harbor robot-account credential,
  # scoped push-only to the `kubevirt/` project -- see
  # ppat/homelab-ops-kubernetes-experiments#218). Same acceptance basis as the sandboxes:
  # only Flux creates ExternalSecrets in this namespace, and this namespace runs nothing
  # with the ability to author its own -- its only workloads are suspended CronJobs
  # triggered by `kubectl create job`, not an open-ended compute surface like
  # sandbox-talos's agent-admin access.
  #
  # Prune an entry when its consumer goes away, not just add one when a new consumer
  # shows up: `pihole` was removed here because no ExternalSecret uses it (or `dns`,
  # where Pi-hole actually lives) -- dead config surviving a rename. An allowlist that
  # only ever grows erodes the same way this one did, without anything looking wrong.
  conditions:
  - namespaces:
    - ai
    - authentik
    - cert-manager
    - coder
    - default
    - downloaders
    - external-dns
    - flux-system
    - freeradius
    - home-automation
    - image-builder
    - logging
    - longhorn-system
    - maddy
    - minio
    - monitoring
    - n8n
    - obsidian-vault
    - openclaw
    - sandbox-docker
    - sandbox-lifecycle
    - sandbox-talos
    - tailscale
    - traefik
    - unifi
