---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
# Both namespaces predate Flux ownership; ssa: merge adopts them instead of failing on a
# conflict over fields it did not set.
    kustomize.toolkit.fluxcd.io/ssa: merge
  labels:
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    kustomize.toolkit.fluxcd.io/ssa: merge
  labels:
    goldilocks.fairwinds.com/enabled: "true"
