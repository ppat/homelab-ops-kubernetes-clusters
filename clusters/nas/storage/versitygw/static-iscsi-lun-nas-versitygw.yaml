---
# The in-tree `iscsi` plugin shells out to `iscsiadm` on the node, so the node needs
# open-iscsi installed and iscsid running, and its initiator IQN from
# /etc/iscsi/initiatorname.iscsi must be in the LUN's allowed-initiator list on the
# Synology. Rebuilding the VM regenerates that file unless it is preserved, and the volume
# then fails to attach with an authorization error.
#
# The LUN is created, snapshotted and cloned on the Synology and nothing in the cluster
# provisions or reclaims it, which is why there is no CSI driver and no StorageClass.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-iscsi-lun-nas-versitygw
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 1536Gi
  # Not Block: the kubelet exports kubelet_volume_stats_* only in filesystem mode, and free
  # space is the signal the store's capacity design rests on.
  volumeMode: Filesystem
  # Reserves the volume for one claim. The claim's volumeName stops it reaching another
  # volume; this stops another claim reaching it -- an Available volume with class "" is
  # offered to any pending claim that resolves to "" and fits, and a 1Gi request fits in
  # 1536Gi. Omit the uid: Kubernetes fills it in on binding.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: versitygw-data
    namespace: versitygw
  # No nodeAffinity, deliberately. The node-level constraint is already enforced a layer
  # down -- the LUN's allowed-initiator list names exactly one IQN, so no other node can
  # attach it at all. Declaring it here as well would add an immutable field keyed on a node
  # identity that a VM rebuild does not preserve, i.e. friction on attachment during
  # disaster recovery, which is the moment it can least be afforded.
  #
  # Immutable after creation, unlike mountOptions and capacity: correcting iqn or lun means
  # deleting and recreating this object, per the operator runbook.
  iscsi:
    targetPortal: ${ipaddress_synology}:3260
    iqn: iqn.2000-01.com.synology:syn-rs1221.versitygw
    # The mapping index DSM assigns, not the LUN's name. Read back from
    # `iscsiadm -m session -P 3` on the node.
    lun: 1
    fsType: ext4
  mountOptions:
  # The gateway never fsyncs, so an acknowledged write is durable only at the next ext4
  # journal commit and a crash inside that window loses a completed object -- WAL being the
  # class where that matters. This bounds the window to about a second. It lives here so a
  # later move to a CSI driver re-declares it from git; note that migration replaces this
  # object rather than editing it, since the volume source is immutable.
  - commit=1
  # Restores read hundreds of thousands of small objects whole; relatime would turn each
  # read into a metadata write.
  - noatime
  - nodev
  - noexec
  - nosuid
  persistentVolumeReclaimPolicy: Retain
  # Binding requires the volume's and the claim's classes to agree, and design forbids a
  # StorageClass here entirely. On a PV, absent and "" bind identically -- the
  # DefaultStorageClass admission plugin that would fill one in only ever looks at
  # PersistentVolumeClaims (upstream setdefault admission returns early on any other
  # resource), so it is on the claim that the explicit "" is load-bearing. Stated here too
  # so the two halves of the binding read as one decision.
  storageClassName: ""
