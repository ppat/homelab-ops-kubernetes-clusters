---
# First-time preparation of the object store's volume: the two directories the gateway
# mounts, and the store-identity sentinel its startup check asserts. Suspended; triggered
# by hand once on first rollout:
#
#   kubectl -n versitygw create job --from=cronjob/versitygw-prepare-store \
#     versitygw-prepare-store-1
#
# Cluster-side because preparation is a property of what the store sits on, and the only
# other site contemplated for this gateway would not be backed by a LUN.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: versitygw-prepare-store
  namespace: versitygw
  labels:
    app.kubernetes.io/name: versitygw-prepare-store
spec:
  # A suspended CronJob on an impossible schedule is a manual, re-runnable Job template
  # with a scheduler bolted on -- an invention, and the only one this repo has: nothing
  # else here uses `suspend`. It is deliberate, because Kubernetes offers no native
  # primitive for "a one-shot task an operator triggers, possibly more than once", and
  # `create job --from=cronjob/...` is the trigger. The controller returns early for a
  # suspended object before it computes a next fire time, and 31 February never matches,
  # so this stays inert on both counts.
  suspend: true
  schedule: "0 0 31 2 *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: versitygw-prepare-store
    spec:
      # One attempt: every failure here is a deliberate refusal about the volume's state,
      # and retrying only reprints it.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: versitygw-prepare-store
            # The module's invariant: anything mounting this ReadWriteOnce volume carries
            # this label and the matching affinity below, and is thereby co-located with
            # whatever already holds it. Trivially satisfied on a single node; it stops
            # being trivial the moment the cluster grows, and the LUN admits exactly one
            # initiator IQN, so a misplaced pod hangs on attach rather than failing fast.
            versitygw.storage/shares-object-volume: "true"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          affinity:
            podAffinity:
              # The gateway's symmetric form, not the sweep's gateway-targeting one: this
              # job runs before any gateway exists (the gateway's startup check refuses to
              # start without the sentinel this job writes), so a rule requiring a gateway
              # would leave the operator's one manual step Pending forever. A symmetric
              # selector is self-satisfying for a lone pod and binds to the node holding
              # the volume once anything else does.
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    versitygw.storage/shares-object-volume: "true"
                topologyKey: kubernetes.io/hostname
          containers:
          - name: prepare
            image: python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
            # -B: /scripts is read-only and CPython would try to write __pycache__ there.
            command: [python3, -B, /scripts/prepare-store.py]
            env:
            - name: STORE_ROOT
              value: /store
            - name: STORE_NAME
              value: versitygw-nas
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              # The gateway's uid, so it can write into what this creates.
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            volumeMounts:
            # The volume root, never `subPath: data`: the kubelet creates a missing
            # subPath, which would manufacture the directory whose absence this job checks.
            - name: store
              mountPath: /store
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            # Must match the gateway's and the sweep's: under OnRootMismatch, differing
            # fsGroups make every mount look mismatched and each start rechowns the tree.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: store
            persistentVolumeClaim:
              claimName: versitygw-data
          - name: scripts
            configMap:
              name: versitygw-prepare-store-script
              defaultMode: 0555
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
