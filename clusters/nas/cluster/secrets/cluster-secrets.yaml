---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  data:
  - secretKey: cert_issuer_email
    remoteRef:
      key: cluster_nas_cert_issuer_email
  - secretKey: dns_zone
    remoteRef:
      key: cluster_nas_dns_zone
  - secretKey: domain_name
    remoteRef:
      key: cluster_nas_domain_name
  - secretKey: externaldns_ip_address
    remoteRef:
      key: cluster_nas_externaldns_ip
  - secretKey: metallb_standard_ip_pool
    remoteRef:
      key: cluster_nas_metallb_ip_pool
  - secretKey: ipaddress_nfs
    remoteRef:
      key: ipaddress_synology_main
  # The same address as ipaddress_nfs, under a protocol-neutral name: it is also the iSCSI
  # portal for the object store's LUN.
  - secretKey: ipaddress_synology
    remoteRef:
      key: ipaddress_synology_main
  # Read from the same shared Bitwarden project as this cluster's own cluster_nas_* keys
  # (confirmed: both clusters' ClusterSecretStores carry identical organizationID/projectID) -
  # needed to build the remote-write/Loki-push URLs this cluster's Alloy targets on homelab.
  - secretKey: homelab_domain_name
    remoteRef:
      key: cluster_homelab_domain_name
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secret-manager-store
    kind: ClusterSecretStore
