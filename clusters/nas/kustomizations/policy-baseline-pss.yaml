---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-baseline-standard
  namespace: flux-system
spec:
  interval: 1h
  path: ./pod-security-standard/baseline
  prune: true
  sourceRef:
    kind: GitRepository
    name: policies
    namespace: flux-system
  timeout: 5m
  wait: false
