---
# The gateway publishes no Prometheus endpoint, so its request counters reach Prometheus
# only through the StatsD exporter beside it. The port is named rather than numbered
# because the same Service also exposes the exporter's UDP ingest port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: versitygw-metrics
  namespace: versitygw
  labels:
    app.kubernetes.io/name: versitygw-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: versitygw-metrics
  endpoints:
  - port: metrics
    interval: 60s
