---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics-release
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-state-metrics
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repository
        namespace: flux-system
      version: 8.4.1
  dependsOn:
  - name: prometheus-operator-crds-release
    namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: kube-state-metrics
  targetNamespace: monitoring
  timeout: 5m0s
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      monitor:
        enabled: true
