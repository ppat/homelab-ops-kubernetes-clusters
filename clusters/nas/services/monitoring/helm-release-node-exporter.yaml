---
# A standalone DaemonSet rather than folding host-metrics collection into the alloy
# node-collector: no extra hostPath/capability surface on the module's own DaemonSet, and
# it survives a second node with zero rework if this cluster ever stops being single-node.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter-release
  namespace: monitoring
spec:
  chart:
    spec:
      chart: prometheus-node-exporter
      interval: 24h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repository
        namespace: flux-system
      version: 4.56.3
  dependsOn:
  - name: prometheus-operator-crds-release
    namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: node-exporter
  targetNamespace: monitoring
  timeout: 5m0s
  upgrade:
    remediation:
      retries: 3
  values:
    prometheus:
      monitor:
        enabled: true
