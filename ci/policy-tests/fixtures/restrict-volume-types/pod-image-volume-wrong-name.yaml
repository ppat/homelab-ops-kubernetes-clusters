---
# EXPECTED: FLAGGED (kyverno apply exits 1). Falsification control #1, on the NAME axis.
#
# Byte-for-byte pod-image-volume-in-scope.yaml with one field changed: metadata.name. Same
# namespace, same `image` volumes, same everything else. It must still fail, because the
# exclusion in policies/pod-security-standard/restricted/restrict-volume-types.yaml is scoped
# to `provision-agent-admin*` AND sandbox-lifecycle, not to the namespace.
#
# This is the control that catches the tempting broadening: dropping `names:` to exempt the
# whole namespace would exempt exactly the pods that hold a cluster-admin credential in
# memory, and every other workload anyone puts there later. A green in-scope fixture on its
# own would not notice that; this one turns green -- i.e. wrong -- the moment it does.
apiVersion: v1
kind: Pod
metadata:
  name: some-other-workload-6b9f4c8d5-x2kqp
  namespace: sandbox-lifecycle
spec:
  restartPolicy: Never
  containers:
  - name: provision
    image: docker.io/curlimages/curl:8.21.0
    volumeMounts:
    - name: talosctl-bin
      mountPath: /opt/talosctl
      readOnly: true
    - name: kubectl-bin
      mountPath: /opt/kubectl
      readOnly: true
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: talosctl-bin
    image:
      reference: ghcr.io/siderolabs/talosctl:v1.13.7
      pullPolicy: IfNotPresent
  - name: kubectl-bin
    image:
      reference: registry.k8s.io/kubectl:v1.36.0
      pullPolicy: IfNotPresent
  - name: workspace
    emptyDir:
      sizeLimit: 512Mi
