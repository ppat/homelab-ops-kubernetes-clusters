---
# EXPECTED: ALLOWED (kyverno apply exits 0), by exclusion rather than by the allow-list.
#
# The `virt-handler*` / kubevirt exclusion is the one exclusion in this policy that has nothing
# to do with `image` volumes, and it must survive the allow-listing of `image` untouched.
# Measured against the live DaemonSet pod (virt-handler-*, ns kubevirt): it mounts SIX hostPath
# volumes -- /var/run/kubevirt-libvirt-runtimes, /var/run/kubevirt, /var/run/kubevirt-private,
# /var/lib/kubelet/pods, /var/lib/kubelet and /var/lib/kubevirt-node-labeller -- and zero
# `image` volumes. Six of those hostPaths are reproduced below; the rest of its volume set
# (secrets, emptyDir, downwardAPI, projected) is allow-listed anyway and is omitted, since the
# policy reads volume *keys* only.
#
# So this exclusion is entirely justified by hostPath and is unaffected by the `image` change.
# Its paired control is pod-virt-launcher-in-kubevirt-hostpath-denied.yaml, which pins that the
# exclusion is still scoped by NAME and not merely by namespace -- without that control this
# fixture would pass just as happily against a blanket exemption for the whole kubevirt
# namespace, which is a materially different and much worse policy.
apiVersion: v1
kind: Pod
metadata:
  name: virt-handler-54dpv
  namespace: kubevirt
spec:
  restartPolicy: Always
  containers:
  - name: virt-handler
    image: quay.io/kubevirt/virt-handler:v1.9.0
    volumeMounts:
    - name: libvirt-runtimes
      mountPath: /var/run/kubevirt-libvirt-runtimes
    - name: virt-share-dir
      mountPath: /var/run/kubevirt
    - name: kubelet-pods
      mountPath: /pods
  volumes:
  - name: libvirt-runtimes
    hostPath:
      path: /var/run/kubevirt-libvirt-runtimes
  - name: virt-share-dir
    hostPath:
      path: /var/run/kubevirt
  - name: virt-private-dir
    hostPath:
      path: /var/run/kubevirt-private
  - name: kubelet-pods
    hostPath:
      path: /var/lib/kubelet/pods
  - name: kubelet
    hostPath:
      path: /var/lib/kubelet
  - name: node-labeller
    hostPath:
      path: /var/lib/kubevirt-node-labeller
