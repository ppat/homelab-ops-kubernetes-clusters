---
# EXPECTED: EXCLUDED (kyverno apply exits 0).
#
# The one pod the `image`-volume exclusion in
# policies/pod-security-standard/restricted/restrict-volume-types.yaml is for: a
# provision-agent-admin Job pod in sandbox-lifecycle. Job pods are named
# <cronjob>-<timestamp>-<hash>, so the exclusion's `provision-agent-admin*` glob has to match
# that shape rather than the bare CronJob name -- which is the reason this fixture carries a
# realistic generated name instead of `provision-agent-admin`.
#
# Only the fields the policy actually reads are kept (it inspects the *keys* of each entry in
# spec.volumes and nothing else), plus enough container to be a valid Pod. Deliberately not a
# copy of the shipped manifest: this fixture exists to pin the exclusion's *scope*, and a
# fixture that drifts every time the real CronJob's script or resources change would be a
# maintenance tax that tests nothing extra. The image references are the real ones because
# they are what makes this an `image` volume in the first place.
#
# Its two sibling fixtures are the falsification half -- same volumes, one field changed each
# -- and both must FAIL. If any of the three ever stops behaving as its header says, the
# exclusion has silently changed shape. See .github/workflows/static-analysis.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: provision-agent-admin-29764440-z2blj
  namespace: sandbox-lifecycle
spec:
  restartPolicy: Never
  containers:
  - name: provision
    image: docker.io/curlimages/curl:8.21.0
    volumeMounts:
    - name: talosctl-bin
      mountPath: /opt/talosctl
      readOnly: true
    - name: kubectl-bin
      mountPath: /opt/kubectl
      readOnly: true
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: talosctl-bin
    image:
      reference: ghcr.io/siderolabs/talosctl:v1.13.7
      pullPolicy: IfNotPresent
  - name: kubectl-bin
    image:
      reference: registry.k8s.io/kubectl:v1.36.0
      pullPolicy: IfNotPresent
  - name: workspace
    emptyDir:
      sizeLimit: 512Mi
