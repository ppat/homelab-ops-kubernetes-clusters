---
# EXPECTED: ALLOWED (kyverno apply exits 0).
#
# The headline claim of the change these fixtures pin: an `image` volume is permitted by
# restrict-volume-types for an ordinary workload, with no exclusion, no exemption and nothing
# special about its name or namespace. `default` is chosen precisely because it is the most
# boring namespace on the cluster -- it appears nowhere in the policy's exclude list.
#
# This fixture on its own proves almost nothing: it would also pass against a policy that had
# been deleted, or one that allowed everything. What gives it meaning is the pod-*-denied.yaml
# fixtures alongside it, which must still fail. Read this directory as one test, not seven.
#
# Only the fields the policy actually reads are kept -- it inspects the *keys* of each entry in
# spec.volumes and nothing else -- plus enough container to be a valid Pod. The `emptyDir` is
# here so the fixture also exercises the ordinary-volume path rather than being all-`image`.
# See .github/workflows/static-analysis.yaml for how the expected outcome is asserted.
apiVersion: v1
kind: Pod
metadata:
  name: image-volume-consumer-6b9f4c8d5-x2kqp
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: tools
    image: docker.io/curlimages/curl:8.21.0
    volumeMounts:
    - name: kubectl-bin
      mountPath: /opt/kubectl
      readOnly: true
    - name: workspace
      mountPath: /workspace
  volumes:
  - name: kubectl-bin
    image:
      reference: registry.k8s.io/kubectl:v1.36.0
      pullPolicy: IfNotPresent
  - name: workspace
    emptyDir:
      sizeLimit: 512Mi
