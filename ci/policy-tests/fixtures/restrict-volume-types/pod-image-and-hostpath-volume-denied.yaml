---
# EXPECTED: FLAGGED (kyverno apply exits 1).
#
# Allowing `image` must not become a way to smuggle in something else. The rule's condition
# flattens the keys of *every* entry in spec.volumes into one list and denies if ANY of them is
# outside the allow-list, so a pod carrying both an allowed `image` volume and a disallowed
# hostPath volume must still be flagged on the hostPath.
#
# This is a control against a specific plausible mis-edit rather than a hypothetical one: the
# allow-list is a JMESPath expression over flattened keys, and it is easy to change it into
# something that reads "if any key is allowed, pass" -- which would be green on every other
# fixture in this directory and catastrophically wrong. That mutation only shows up here.
apiVersion: v1
kind: Pod
metadata:
  name: mixed-volumes-workload-7c8d6f9b4-mk2rl
  namespace: monitoring
spec:
  restartPolicy: Never
  containers:
  - name: tools
    image: docker.io/curlimages/curl:8.21.0
    volumeMounts:
    - name: kubectl-bin
      mountPath: /opt/kubectl
      readOnly: true
    - name: host-run
      mountPath: /host/run
  volumes:
  - name: kubectl-bin
    image:
      reference: registry.k8s.io/kubectl:v1.36.0
      pullPolicy: IfNotPresent
  - name: host-run
    hostPath:
      path: /var/run
      type: Directory
