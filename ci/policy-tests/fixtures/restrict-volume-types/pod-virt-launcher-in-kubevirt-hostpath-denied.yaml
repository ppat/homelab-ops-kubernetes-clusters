---
# EXPECTED: FLAGGED (kyverno apply exits 1). One fixture, two falsification controls.
#
# A pod named `virt-launcher-*` carrying virt-handler's hostPath volume set, in namespace
# kubevirt. Every exclusion in this policy is scoped by name AND namespace, and this pod is
# deliberately built so that it matches exactly one half of each of the two exclusions and must
# therefore still be flagged by both:
#
#   * NAME axis, for the `virt-handler*` / kubevirt exclusion -- right namespace, wrong name.
#     If `names:` were ever dropped there, every workload anyone puts in kubevirt would get a
#     free pass on hostPath, i.e. on node-root access. pod-virt-handler-hostpath-allowed.yaml
#     alone cannot see that happen; this fixture turns green -- i.e. wrong -- the moment it does.
#   * NAMESPACE axis, for the `virt-launcher*` / sandbox-docker + sandbox-talos exclusion --
#     right name, wrong namespace. virt-launcher does not run in kubevirt (virt-operator
#     schedules it into the VM's own namespace), so this pod is not a real shape; it is the
#     shape that catches that exclusion being widened to follow the name anywhere.
#
# The hostPath volumes rather than `image` volumes are the point: `image` is now allow-listed
# globally, so an `image`-based fixture here would pass whether the exclusions existed or not.
# hostPath is what these two exclusions still actually decide.
apiVersion: v1
kind: Pod
metadata:
  name: virt-launcher-talos-vm-zqrlj
  namespace: kubevirt
spec:
  restartPolicy: Always
  containers:
  - name: compute
    image: quay.io/kubevirt/virt-launcher:v1.9.0
    volumeMounts:
    - name: kubelet
      mountPath: /var/lib/kubelet
  volumes:
  - name: libvirt-runtimes
    hostPath:
      path: /var/run/kubevirt-libvirt-runtimes
  - name: virt-share-dir
    hostPath:
      path: /var/run/kubevirt
  - name: virt-private-dir
    hostPath:
      path: /var/run/kubevirt-private
  - name: kubelet-pods
    hostPath:
      path: /var/lib/kubelet/pods
  - name: kubelet
    hostPath:
      path: /var/lib/kubelet
  - name: node-labeller
    hostPath:
      path: /var/lib/kubevirt-node-labeller
