---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    kyverno.io/kyverno-version: 1.6.0
    kyverno.io/kubernetes-version: "1.22-1.23"
    policies.kyverno.io/description: >-
      HostPath volumes let Pods use host directories and volumes in containers.
      Using host resources can be used to access shared data or escalate privileges
      and should not be allowed. This policy ensures no hostPath volumes are in use.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: host-path
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: >-
        HostPath volumes are forbidden. The field spec.volumes[*].hostPath must be unset.
      pattern:
        spec:
          =(volumes):
          - X(hostPath): "null"
    exclude:
      any:
      - resources:
          namespaces:
          - csi-driver-nfs
          - kube-system
          - longhorn-system
          - system-upgrade
      - resources:
          names:
          - 'node-problem-detector*'
          - 'kube-prometheus-stack-prometheus-node-exporter*'
          namespaces:
          - monitoring
      - resources:
          names:
          - 'promtail*'
          namespaces:
          - logging
      # Grafana Alloy is replacing promtail as the node-level log collector; both run in
      # parallel for a 24-72h equivalence comparison before promtail is removed, so this
      # exclusion exists alongside (not instead of) the promtail one above -- it is not
      # cutover yet. Necessary because node log files (/var/log/pods, /var/log/journal,
      # /run/log/journal), /etc/machine-id, and Alloy's own read-offset state
      # (/var/lib/alloy) are only reachable via the node filesystem, which is inherent to
      # any node-level log collector, not a shortcut specific to Alloy. Bounded by
      # namespace (logging) AND name prefix (alloy*) together -- the prefix match is a
      # coarse control, so anything else deployed into `logging` named alloy* inherits it
      # too. Wrong if Alloy ever stops needing node-level file access, or if `logging`
      # becomes a namespace where arbitrary workloads can be created. The promtail entry
      # above is removed in the cutover PR once the comparison window closes; this one
      # stays after that.
      - resources:
          names:
          - 'alloy*'
          namespaces:
          - logging
      - resources:
          names:
          - 'intel-gpu-plugin-gpu-device*'
          namespaces:
          - intel-device-plugins
      # virt-handler hostPath-mounts libvirt/qemu runtime dirs, kubelet's pod and device
      # dirs, and node-labeller state (see disallow-privileged-containers.yaml for what
      # bounds it). Verified against upstream KubeVirt's generated manifests: virt-launcher
      # gets /dev/kvm and friends through Kubernetes device-plugin resource requests, not a
      # hostPath volume, and virt-operator/virt-api/virt-controller mount none at all --
      # neither is excluded here. Name-scoped, not namespace-scoped, on purpose: a
      # namespace-wide exclusion would silently admit hostPath for anything else later
      # deployed into `kubevirt`, not just this one DaemonSet. `kubevirt` is the conventional
      # install namespace for virt-handler; KubeVirt is not installed yet, so this exclusion
      # grants nothing until it is, and no other namespace is listed since virt-handler never
      # runs outside it.
      - resources:
          names:
          - 'virt-handler*'
          namespaces:
          - kubevirt
