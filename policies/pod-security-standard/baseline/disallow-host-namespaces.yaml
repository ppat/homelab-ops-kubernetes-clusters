---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.6.0
    kyverno.io/kubernetes-version: "1.22-1.23"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Host namespaces (Process ID namespace, Inter-Process Communication namespace, and
      network namespace) allow access to shared information and can be used to elevate
      privileges. Pods should not be allowed access to host namespaces. This policy ensures
      fields which make use of these host namespaces are unset or set to `false`.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: host-network-namespaces
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: >-
        Sharing the host network namespaces is disallowed. The field spec.hostNetwork
        must be unset or set to `false`.
      pattern:
        spec:
          =(hostNetwork): "false"
    exclude:
      any:
      - resources:
          namespaces:
          - csi-driver-nfs
          - metallb-system
      - resources:
          names:
          - 'kube-prometheus-stack-prometheus-node-exporter*'
          namespaces:
          - monitoring
  - name: host-pid-namespaces
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: >-
        Sharing the host pid namespaces is disallowed. The field spec.hostPID must be
        unset or set to `false`.
      pattern:
        spec:
          =(hostPID): "false"
    exclude:
      any:
      - resources:
          names:
          - 'kube-prometheus-stack-prometheus-node-exporter*'
          namespaces:
          - monitoring
      # virt-handler sets hostPID: true to see and supervise the qemu process libvirt starts
      # on the node -- it has no other way to monitor a process that isn't a child of its own
      # container. See disallow-privileged-containers.yaml for what bounds virt-handler's
      # access generally. Verified against upstream KubeVirt's generated manifests: virt-handler
      # doesn't set hostNetwork or hostIPC, so neither the rule above nor the one below carries
      # a KubeVirt exclusion, and virt-operator/virt-api/virt-controller/virt-launcher don't
      # need this rule's exclusion either.
      - resources:
          names:
          - 'virt-handler*'
          namespaces:
          - kubevirt
  - name: host-ipc-namespaces
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: >-
        Sharing the host ipc namespaces is disallowed. The field spec.hostIPC must be
        unset or set to `false`.
      pattern:
        spec:
          =(hostIPC): "false"
