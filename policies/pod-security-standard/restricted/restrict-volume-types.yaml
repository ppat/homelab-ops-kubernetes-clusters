---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-volume-types
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.22-1.23"
    kyverno.io/kyverno-version: 1.6.0
    policies.kyverno.io/description: >-
      In addition to restricting HostPath volumes, the restricted pod security profile
      limits usage of non-core volume types to those defined through PersistentVolumes.
      This policy blocks any other type of volume other than those in the allow list.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: restricted-volumes
    match:
      any:
      - resources:
          kinds:
          - Pod
    preconditions:
      all:
      - key: "{{ request.operation || 'BACKGROUND' }}"
        operator: NotEquals
        value: DELETE
    validate:
      message: >-
        Only the following types of volumes may be used: configMap, csi, downwardAPI,
        emptyDir, ephemeral, persistentVolumeClaim, projected, and secret.
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.volumes[].keys(@)[] || '' }}"
            operator: AnyNotIn
            value:
            - name
            - configMap
            - csi
            - downwardAPI
            - emptyDir
            - ephemeral
            - persistentVolumeClaim
            - projected
            - secret
            - ''
    exclude:
      any:
      # virt-handler mounts hostPath volumes for libvirt/qemu runtime state, kubelet's
      # pod/device dirs, and node-labeller data (see ../baseline/disallow-host-path.yaml) --
      # hostPath isn't in this policy's allow-list at all, so anything using it needs this
      # exclusion. virt-launcher gets its device access (kvm/tun/vhost-net) through Kubernetes
      # device-plugin resource requests instead, not a volume -- it needs its own exclusion
      # below, but for an unrelated reason (the `Image` volume type, not hostPath).
      - resources:
          names:
          - 'virt-handler*'
          namespaces:
          - kubevirt
      # virt-launcher mounts two volumes of Kubernetes' `Image` volume type -- `bootdisk` (the
      # VM's containerDisk) and `launcher-volume` (virt-launcher's own binary, self-mounted) --
      # neither of which is in this policy's allow-list; the type simply postdates it. Verified
      # against both VMs' live pod specs (virt-launcher-docker-vm-*, virt-launcher-talos-vm-*):
      # both carry exactly these two `image:` volumes, mounted read-only at
      # /var/run/kubevirt-image-volume/disk_0 and /container-disk-binary. The pod spec is
      # generated by virt-controller, not authored here, so it can't be brought into compliance
      # by editing a manifest.
      #
      # What bounds the risk: both VMs' volumeMounts declare readOnly: true for these mounts --
      # consistent with the Image volume type's design, which doesn't support write access --
      # and every image reference is pinned by digest, either to our own Harbor (talos-vm's
      # containerDisk) or to an upstream source we chose (docker-vm's containerDisk from
      # quay.io/containerdisks, virt-launcher's own image from quay.io/kubevirt). Nothing here
      # resolves a floating tag or an externally-supplied reference.
      #
      # What would make this wrong later: the exclusion covers any pod named virt-launcher* in
      # these two namespaces, not just the two images verified above -- a future VM definition
      # in sandbox-docker or sandbox-talos that points its containerDisk at an unvetted image
      # would mount it here without the audit stream flagging it. Reviewing containerDisk image
      # references at the point a VM is defined stays a manual discipline; this policy no
      # longer backstops it for these two namespaces. Name-scoped, not namespace-scoped, and
      # limited to the same two namespaces as the virt-launcher exclusions in
      # ../../best-practices/add-emptydir-sizelimit.yaml and restrict-seccomp-strict.yaml,
      # rather than `kubevirt` (virt-launcher doesn't run there) or left open to any future VM
      # namespace.
      - resources:
          names:
          - 'virt-launcher*'
          namespaces:
          - sandbox-docker
          - sandbox-talos
