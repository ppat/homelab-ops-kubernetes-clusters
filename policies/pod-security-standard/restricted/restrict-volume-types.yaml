---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-volume-types
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.22-1.23"
    kyverno.io/kyverno-version: 1.6.0
    policies.kyverno.io/description: >-
      In addition to restricting HostPath volumes, the restricted pod security profile
      limits usage of non-core volume types to those defined through PersistentVolumes.
      This policy blocks any other type of volume other than those in the allow list.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: restricted-volumes
    match:
      any:
      - resources:
          kinds:
          - Pod
    preconditions:
      all:
      - key: "{{ request.operation || 'BACKGROUND' }}"
        operator: NotEquals
        value: DELETE
    validate:
      message: >-
        Only the following types of volumes may be used: configMap, csi, downwardAPI,
        emptyDir, ephemeral, persistentVolumeClaim, projected, and secret.
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.volumes[].keys(@)[] || '' }}"
            operator: AnyNotIn
            value:
            - name
            - configMap
            - csi
            - downwardAPI
            - emptyDir
            - ephemeral
            - persistentVolumeClaim
            - projected
            - secret
            - ''
    exclude:
      any:
      # virt-handler mounts hostPath volumes for libvirt/qemu runtime state, kubelet's
      # pod/device dirs, and node-labeller data (see ../baseline/disallow-host-path.yaml) --
      # hostPath isn't in this policy's allow-list at all, so anything using it needs this
      # exclusion. virt-launcher gets its device access (kvm/tun/vhost-net) through Kubernetes
      # device-plugin resource requests instead, not a volume -- it needs its own exclusion
      # below, but for an unrelated reason (the `Image` volume type, not hostPath).
      - resources:
          names:
          - 'virt-handler*'
          namespaces:
          - kubevirt
      # virt-launcher mounts two volumes of Kubernetes' `Image` volume type -- `bootdisk` (the
      # VM's containerDisk) and `launcher-volume` (virt-launcher's own binary, self-mounted) --
      # neither of which is in this policy's allow-list; the type simply postdates it. Verified
      # against both VMs' live pod specs (virt-launcher-docker-vm-*, virt-launcher-talos-vm-*):
      # both carry exactly these two `image:` volumes, mounted read-only at
      # /var/run/kubevirt-image-volume/disk_0 and /container-disk-binary. The pod spec is
      # generated by virt-controller, not authored here, so it can't be brought into compliance
      # by editing a manifest.
      #
      # What bounds the risk: both VMs' volumeMounts declare readOnly: true for these mounts --
      # consistent with the Image volume type's design, which doesn't support write access --
      # and every image reference is pinned by digest, either to our own Harbor (talos-vm's
      # containerDisk) or to an upstream source we chose (docker-vm's containerDisk from
      # quay.io/containerdisks, virt-launcher's own image from quay.io/kubevirt). Nothing here
      # resolves a floating tag or an externally-supplied reference.
      #
      # What would make this wrong later: the exclusion covers any pod named virt-launcher* in
      # these two namespaces, not just the two images verified above -- a future VM definition
      # in sandbox-docker or sandbox-talos that points its containerDisk at an unvetted image
      # would mount it here without the audit stream flagging it. Reviewing containerDisk image
      # references at the point a VM is defined stays a manual discipline; this policy no
      # longer backstops it for these two namespaces. Name-scoped, not namespace-scoped, and
      # limited to the same two namespaces as the virt-launcher exclusions in
      # ../../best-practices/add-emptydir-sizelimit.yaml and restrict-seccomp-strict.yaml,
      # rather than `kubevirt` (virt-launcher doesn't run there) or left open to any future VM
      # namespace.
      - resources:
          names:
          - 'virt-launcher*'
          namespaces:
          - sandbox-docker
          - sandbox-talos
      # provision-agent-admin (homelab-ops-kubernetes-experiments, sandbox-talos/lifecycle/)
      # mounts two volumes of the same `Image` type, for the same reason it postdates this
      # policy's allow-list -- but unlike virt-launcher's, this pod spec IS authored by hand,
      # so the choice needs justifying rather than merely tolerating.
      #
      # WHY IT CANNOT BE ANY OF THE ALLOWED TYPES. This CronJob needs `kubectl` and `talosctl`
      # on disk. It runs in sandbox-lifecycle, the one namespace permitted to write Secrets to
      # this cluster's API, holding a freshly minted cluster-admin credential in memory -- so
      # it deliberately has no internet egress and cannot download them (see that namespace's
      # network-policy.yaml; shipping it with runtime curls is what caused the outage fixed in
      # that repo's #240). An `image` volume is pulled by the kubelet, exactly like a container
      # image, so it needs no egress rule at all. A ConfigMap cannot carry a ~100MB binary, and
      # an emptyDir has to be filled by *something* -- an initContainer fetching them is
      # subject to the identical pod NetworkPolicy, so it does not help.
      #
      # NOT widened into the allow-list above, deliberately. An `image` volume mounts an
      # arbitrary OCI image's filesystem into a pod; that is worth flagging by default, which
      # is the judgement the virt-launcher exclusion above already made when it chose an
      # exclusion over an allow-list entry. Kubernetes' own PSS `restricted` profile does
      # permit `image` volumes (measured: a probe pod using two of them drew a
      # `restricted:latest` warning naming only its missing seccompProfile), so widening would
      # be defensible upstream-alignment -- but it would silently retire a constraint this
      # cluster has chosen to keep, for every workload, to fix one.
      #
      # WHAT BOUNDS THE RISK, and it is weaker here than for virt-launcher above, so read this
      # rather than assuming parity: both references are first-party upstream images for the
      # tools they carry (ghcr.io/siderolabs/talosctl, registry.k8s.io/kubectl), both are
      # mounted `readOnly: true`, and the container consumes them as binaries only. But they
      # are pinned by TAG, NOT DIGEST -- not by preference: pinning an image volume by digest
      # needs the `ImageVolumeWithDigest` feature gate, which is ALPHA and measured disabled
      # (`kubernetes_feature_enabled` = 0) on all four nodes of this cluster. So unlike every
      # reference in the virt-launcher exclusion above, these two are mutable at the source:
      # an upstream republish of the same tag would be mounted here without anything noticing.
      #
      # WHAT WOULD MAKE THIS WRONG LATER: (1) this exclusion covers any pod named
      # provision-agent-admin* in this namespace, so a future rewrite of that CronJob mounting
      # a *different*, unvetted image would pass unflagged -- reviewing the `reference:` values
      # at the point they change stays a manual discipline; (2) if `ImageVolumeWithDigest`
      # graduates and is enabled here, these two should be repinned to digests and this
      # paragraph revisited, because the tag-mutability caveat is the only real gap;
      # (3) if a second workload in this namespace needs the same treatment, prefer a second
      # name-scoped entry over broadening this one to the namespace -- a namespace-wide
      # exclusion here would cover exactly the pods that hold the cluster-admin credential.
      - resources:
          names:
          - 'provision-agent-admin*'
          namespaces:
          - sandbox-lifecycle
