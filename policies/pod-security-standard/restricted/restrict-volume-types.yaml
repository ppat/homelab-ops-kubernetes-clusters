---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-volume-types
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/minversion: 1.6.0
    kyverno.io/kubernetes-version: "1.22-1.23"
    kyverno.io/kyverno-version: 1.6.0
    policies.kyverno.io/description: >-
      In addition to restricting HostPath volumes, the restricted pod security profile
      limits usage of non-core volume types to those defined through PersistentVolumes.
      This policy blocks any other type of volume other than those in the allow list.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: restricted-volumes
    match:
      any:
      - resources:
          kinds:
          - Pod
    preconditions:
      all:
      - key: "{{ request.operation || 'BACKGROUND' }}"
        operator: NotEquals
        value: DELETE
    validate:
      message: >-
        Only the following types of volumes may be used: configMap, csi, downwardAPI,
        emptyDir, ephemeral, image, persistentVolumeClaim, projected, and secret.
      deny:
        conditions:
          all:
          - key: "{{ request.object.spec.volumes[].keys(@)[] || '' }}"
            operator: AnyNotIn
            value:
            - name
            - configMap
            - csi
            - downwardAPI
            - emptyDir
            - ephemeral
            # ALIGNMENT WITH UPSTREAM, NOT A LOCAL RELAXATION -- that is the whole justification
            # for this entry, so check it before treating it as a judgement call made here.
            # Kubernetes' own Pod Security Standards `restricted` profile permits `image` volumes
            # from 1.33 onward: `volume.Image != nil` sits in the allow-`continue` switch in
            # staging/src/k8s.io/pod-security-admission/policy/check_restrictedVolumes.go, added
            # by kubernetes/kubernetes#130394 ("Allow ImageVolume for Restricted PSA profiles",
            # SIG Auth, milestone v1.33, merged 2025-02-24, not backported -- absent on
            # release-1.31 and release-1.32, present on release-1.33 and later). This policy is a
            # Kyverno transcription of that profile as it stood at 1.22-1.23 (see the
            # kyverno.io/kubernetes-version annotation above), which simply predates the `image`
            # volume type (KEP-4639, alpha in 1.31): omitting it was drift from upstream rather
            # than a decision this cluster ever made. Because that makes this file no longer a
            # verbatim copy of the upstream Kyverno policy-library rule, do not resynchronise it
            # wholesale from that library -- that would silently revert this.
            #
            # DO NOT "CORRECT" THIS AGAINST THE PUBLISHED DOCS. kubernetes.io's
            # pod-security-standards page still lists only the original eight volume types -- it
            # is stale, and the admission code is what runs. Upstream agrees it is stale:
            # kubernetes/website#55370 is open and triage/accepted as a docs bug, citing #130394.
            # So expect that page to gain `image` eventually; that would confirm this entry
            # rather than challenge it.
            #
            # WHAT THIS PERMITS, PRECISELY -- the properties, not an assertion of safety. A mount
            # of an OCI image's (or OCI artifact's) filesystem, which the kubelet pulls and whose
            # manifest layers it merges the same way it does for a container image. So: (1) it is
            # read-only -- the godoc on core/v1 VolumeSource.Image (the field, not the
            # ImageVolumeSource type) reads "The volume will be mounted read-only (ro) and
            # non-executable files (noexec)." on release-1.33 through release-1.35, and drops the
            # noexec half on 1.36/master. Quote it from the branch you are actually running; the
            # read-only half is on every branch, and it is a kubelet/runtime guarantee about how
            # the mount is made, not something admission validates on the volumeMount; (2) it conveys
            # no host path, no host namespace and no device access, which is exactly what
            # separates it from hostPath and is why upstream was willing to allow it under
            # `restricted`; (3) it grants no reach a pod does not already have, because anything
            # that can name an image in spec.containers[].image can already run that same
            # filesystem -- that third point is upstream's own rationale on #130394. hostPath,
            # the source this policy exists to stop and the only one the PSS *baseline* profile
            # bothers to forbid, stays denied, as does everything else off this list.
            #
            # Its practical value, and why it is worth having cluster-wide rather than by
            # exception: it ships a binary into a pod that is denied internet egress, which no
            # other allowed volume type can do -- a ConfigMap cannot carry a ~100MB binary, an
            # emptyDir has to be filled by something, and an initContainer fetching it is subject
            # to the same NetworkPolicy as the pod it runs in.
            #
            # WHAT THIS ENTRY DOES NOT CONSTRAIN, and so stays a review discipline: WHICH image a
            # pod mounts. Nothing here requires the reference to be digest-pinned, so a mutable
            # tag can change under a pod between restarts. That is equally true of
            # spec.containers[].image and is not a property of this volume type, so it is no
            # argument for denying `image` here -- but if it ever matters it wants an admission
            # rule of its own rather than the removal of this entry.
            #
            # WHAT WOULD MAKE THIS WRONG LATER. The case above rests entirely on "it is a
            # container image pull, mounted read-only, with no host reachability", and it
            # survives none of the following. (1) A future Kubernetes release giving image
            # volumes write semantics or any form of host reachability -- that would require
            # revisiting this entry, not merely the workloads using it. (2) A reference syntax
            # that resolves to something the kubelet would not pull as a container image.
            # (3) Upstream reversing #130394 and dropping `image` back out of `restricted`: the
            # argument here is alignment, so this should follow upstream back out again.
            - image
            - persistentVolumeClaim
            - projected
            - secret
            - ''
    exclude:
      any:
      # virt-handler mounts hostPath volumes for libvirt/qemu runtime state, kubelet's
      # pod/device dirs, and node-labeller data (see ../baseline/disallow-host-path.yaml) --
      # hostPath isn't in this policy's allow-list at all, so anything using it needs this
      # exclusion. Measured on the live DaemonSet pod: six of them
      # (/var/run/kubevirt-libvirt-runtimes, /var/run/kubevirt, /var/run/kubevirt-private,
      # /var/lib/kubelet/pods, /var/lib/kubelet, /var/lib/kubevirt-node-labeller) and zero
      # `image` volumes, so allow-listing `image` above changes nothing here: this exclusion is
      # about hostPath and only hostPath. virt-launcher gets its device access
      # (kvm/tun/vhost-net) through Kubernetes device-plugin resource requests instead, not a
      # volume; its own exclusion below is now a different matter again -- read it.
      - resources:
          names:
          - 'virt-handler*'
          namespaces:
          - kubevirt
      # virt-launcher's exclusion NO LONGER DOES WHAT ITS ORIGINAL RATIONALE SAID, and is kept
      # anyway. It was added because virt-launcher mounts two volumes of Kubernetes' `image`
      # type -- `bootdisk` (the VM's containerDisk) and `launcher-volume` (virt-launcher's own
      # binary, self-mounted) -- back when `image` was not in the allow-list above. It now is,
      # so that reason has evaporated. Measured against both live pod specs
      # (virt-launcher-docker-vm-*, virt-launcher-talos-vm-*): every other volume they carry is
      # already allow-listed (emptyDir, persistentVolumeClaim, secret), which means as these two
      # VMs are defined today this exclusion decides nothing at all.
      #
      # WHY IT STAYS RATHER THAN BEING DELETED AS DEAD CONFIG. virt-launcher's volume set is
      # generated per-VMI by virt-controller, not authored here, so "what volumes it has" is a
      # property of whatever VMI someone writes next, not of these two. A VMI using KubeVirt's
      # `hostDisk` disk type, or a hostPath-backed virtiofs filesystem, reintroduces hostPath
      # into that generated pod immediately -- and it cannot be brought into compliance by
      # editing a manifest here. Deleting the exclusion is therefore a real tightening of the
      # cluster's posture, not a cleanup, and belongs in its own change with its own argument.
      #
      # WHAT IT COSTS TO KEEP: exactly that tightening, foregone. A future VM in sandbox-docker
      # or sandbox-talos that mounts a host path lands unflagged in the audit stream. That was
      # equally true before `image` was allow-listed; it is retained here, not introduced.
      # Reviewing what a new VMI mounts at the point it is defined stays a manual discipline.
      # Name-scoped, not namespace-scoped, and limited to the same two namespaces as the
      # virt-launcher exclusions in ../../best-practices/add-emptydir-sizelimit.yaml and
      # restrict-seccomp-strict.yaml, rather than `kubevirt` (virt-launcher doesn't run there)
      # or left open to any future VM namespace.
      - resources:
          names:
          - 'virt-launcher*'
          namespaces:
          - sandbox-docker
          - sandbox-talos
